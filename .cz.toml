# Commitizen configuration for BlueprintX itself.
#
# Out of pyproject.toml since #233 — the root manifest is docs-only (it exists to drive the
# MkDocs site), so keeping it to package identity plus dependencies matters more here than in
# a real application. Same file name and same rule as the .cz.toml that ships to every
# scaffolded Python project, so there is one answer to "where does commitizen config live".
#
# ⚠️ Losing this file does NOT error: cz falls back to defaults and exits 0 (measured —
# `cz version --project` prints "No project information in this project."). The symptom would
# be an unprefixed tag and a differently formatted changelog, not a red check.
[tool.commitizen]
# Conventional-commit driven changelog. Releases are cut by tagging (see .github/workflows),
# not a hand-run bump; `cz changelog` (via `make changelog`) groups commits by tag into the
# root CHANGELOG.md, which the docs Changelog page single-sources via a snippets include.
#
# `version_provider = "poetry"` reads [tool.poetry] version from pyproject.toml — it keeps
# working with the config in this file, since the provider locates the manifest by project
# root rather than by where the config lives. Here that value is the "0.0.0" stub that
# bin/ci/check_version_sync.sh pins; the real version is the git tag.
name = "cz_conventional_commits"
version_provider = "poetry"
tag_format = "v$version"
