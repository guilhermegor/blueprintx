[mypy]
python_version = 3.11
explicit_package_bases = True
namespace_packages = True

ignore_missing_imports = False

check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_any_explicit = True

exclude = (?x)(^utils/typing/|_internal/utils/typing/)

[mypy-utils.typing.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-chassis.typing.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-*._internal.utils.typing.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-utils.tabular_reader,utils.frames,*._internal.utils.tabular_reader,*._internal.utils.frames]
disallow_any_explicit = False

[mypy-chassis.db_schema.infrastructure.mariadb_handler,chassis.db_schema.infrastructure.mssql_handler,chassis.db_schema.infrastructure.mysql_handler,chassis.db_schema.infrastructure.oracle_handler,chassis.db_schema.infrastructure.postgres_handler]
disallow_any_explicit = False

[mypy-chassis.db_wschema.infrastructure.sanity_check]
disallow_any_explicit = False

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-wwdates.*]
ignore_missing_imports = True

[mypy-defusedxml.*]
ignore_missing_imports = True

[mypy-win32com.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pyodbc.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True
