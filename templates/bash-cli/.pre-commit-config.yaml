default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages:
          - commit-msg

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages:
          - commit-msg

  - repo: local
    hooks:
      # `make lint` IS the CI job (.github/workflows/ci.yml) — one implementation,
      # local and CI run identical shellcheck + shfmt.
      - id: lint
        name: shellcheck + shfmt
        entry: make lint
        language: system
        pass_filenames: false
        files: \.(sh|bats)$|^bin/
