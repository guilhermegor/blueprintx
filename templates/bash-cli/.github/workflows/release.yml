name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected MAJOR.MINOR.PATCH, optionally followed by -<prerelease>." >&2
            exit 1
          fi

      - name: Create and push tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "release: v${VERSION}"
          git push origin "v${VERSION}"

  github_release:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ github.event.inputs.version }}
          persist-credentials: false

      - name: Stamp version and build the release tarball
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          sed -i "s/^CLI_VERSION=\".*\"/CLI_VERSION=\"${VERSION}\"/" "bin/${PROJECT_NAME}"
          tar -czf "${PROJECT_NAME}-${VERSION}.tar.gz" bin lib
          sha256sum "${PROJECT_NAME}-${VERSION}.tar.gz" > "${PROJECT_NAME}-${VERSION}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "${PROJECT_NAME}-${VERSION}.tar.gz" \
            "${PROJECT_NAME}-${VERSION}.tar.gz.sha256" \
            --title "v${VERSION}" \
            --generate-notes
