name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint — shellcheck + shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install shfmt
        run: command -v shfmt >/dev/null || (sudo snap install shfmt)

      - name: make lint
        run: make lint

  test:
    name: Test — bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats

      - name: make test
        run: make test

  # gitleaks, not GitGuardian (blueprintx#155). `ggshield` needs a hosted API key a freshly
  # scaffolded project does not have; with none it exits 3 and scans nothing. gitleaks needs
  # no key, so it is the only scanner that can be ON by default. See docs/secret-scanning.md.
  secret-scan:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: gitleaks scans PAST commits too, not just the working tree.
          fetch-depth: 0

      # Pinning the version pins what is ASKED FOR, never what ARRIVES — and what arrives is
      # unpacked and EXECUTED on this runner, so the checksum is verified before extracting.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      # No --config: gitleaks falls back to its embedded default ruleset. This tier ships no
      # config on purpose — an allowlist is added only for a MEASURED false positive.
      - name: Scan history for secrets
        run: gitleaks git . --no-banner --redact
