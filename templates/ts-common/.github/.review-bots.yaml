
reviewers:
  - login: coderabbitai[bot]
    posts: threads
    note: >-
      Resolves its own threads on seeing the fix ("Addressed in commit <sha>"), which is why
      isResolved cannot be the signal for whether the AUTHOR answered.

  - login: greptile-apps[bot]
    posts: threads
    note: Posts inline review threads with a severity badge; reviews only when asked, autoReview is empty.

  - login: github-actions[bot]
    posts: status
    note: Workflow output, never a review finding.

  - kind: comment-marker
    marker: "Fallback review — runtime:"
    posters: []
    note: >-
      The reviewer ladder's attribution line. Counts as a review only in a comment authored by
      a login in `posters:` and posted after the head commit (docs/faq.md). The author
      association is never consulted, so the PR author cannot forge it (blueprintx#761).
      Empty means no marker is accepted; list the ladder App's login here.
