name: Review Threads

# ⚠️ THIS RUNS THE SHARED GATE — IT DOES NOT REIMPLEMENT IT (blueprintx#175).
#
# The predicate ("a thread is answered when it holds a substantive comment from an author
# OUTSIDE the declared review-bot roster") is a GraphQL query plus a comparison — nothing in
# it is Python-project-specific, and this repo already paid once to collapse two 543-line
# copies of it into templates/python-common/bin/check_review_threads.py. A TypeScript port
# would be a second implementation of the same rule: a second chance to get the bot-that-
# resolves-its-own-thread case wrong (see that file's own docstring for the measurement).
#
# So a ts-* project does not carry its own copy of the script. It fetches the ONE canonical
# copy from BlueprintX at run time and runs it — the same file the Python tiers run, kept in
# sync by construction because there is only ever one of it.
#
# ⚠️ THE COST OF THAT CHOICE, STATED PLAINLY: this job depends on
# raw.githubusercontent.com/guilhermegor/blueprintx staying reachable and on `main` staying a
# working copy of the script. A vendored copy would not have that runtime dependency, but it
# would silently drift the moment python-common's version changed — which is precisely the
# failure mode BlueprintX's own CLAUDE.md documents this gate as having been built to remove.
# Tracking `main` rather than a pinned tag is deliberate too: pinning would reintroduce a
# staleness window (the ts gate keeps running an old predicate after the canonical one is
# fixed) for a reproducibility guarantee this workflow does not otherwise need — it calls the
# script fresh on every run, never persists its output, and asserts nothing about which
# version ran.
#
# Two other packaging options were on the table and rejected for this PR, not in general:
#   - vendoring the file under templates/ts-common/ — rejected, it is the "do not copy" this
#     comment opens with.
#   - templates/common/ (the one surface both language families already copy from, and the
#     structurally cleanest home for a truly shared script) — rejected only because it was
#     out of scope for this PR's surface (concurrent PRs occupy most of the tree); a follow-up
#     should move BOTH the Python and this workflow's fetch step to read from there once that
#     surface is free to touch, which would also remove the network dependency above.
#
# `pull_request_review` fires when a review is submitted; `pull_request_review_comment` fires
# on an individual inline comment. Both are required alongside `pull_request` for the same
# reason as the Python workflow this mirrors: a verdict computed only at push time goes stale
# the moment a review lands, and a stale check is indistinguishable from a passing one
# (blueprintx#180 merged with two threads open and every check green).
#
# ⚠️ `pull_request_review_thread` is a real webhook event but NOT a workflow trigger — adding
# it makes GitHub reject this file wholesale, with no red check to say so (blueprintx#156).
on:
  pull_request:
  pull_request_review:
  pull_request_review_comment:

permissions:
  contents: read
  pull-requests: read

jobs:
  review-threads:
    name: Review threads answered
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      # The gate is Python; the roster is data. Fetching the script keeps this workflow from
      # ever holding its own (possibly stale) copy of the predicate — see the header above.
      - name: Fetch the shared review-threads gate from BlueprintX
        run: |
          curl -fsSL \
            -o check_review_threads.py \
            https://raw.githubusercontent.com/guilhermegor/blueprintx/main/templates/python-common/bin/check_review_threads.py

      # The script reads .review-bots.yaml from its own working directory (Path.cwd()), which
      # is the checkout root here — the same contract every Python-tier adopter relies on.
      # This project's roster ships at .github/.review-bots.yaml (the one ts-common tree the
      # scaffold copies wholesale) rather than the repo root, so it has to be staged first.
      - name: Stage this project's review-bot roster
        run: cp .github/.review-bots.yaml .review-bots.yaml

      # A finding takes BOTH halves: reply with what changed and why, then resolve the
      # thread. Neither half is optional and neither implies the other — a reviewer bot
      # resolves its own threads on seeing the fix, so `isResolved` records ITS satisfaction,
      # never the author's reasoning.
      - name: Every review thread is answered and resolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_THREADS_REQUIRE_RESOLVED: "1"
        run: python check_review_threads.py
