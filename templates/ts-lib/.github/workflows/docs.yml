name: Docs - Build Check

# Build the Docusaurus site on every push and PR to catch broken links, a bad sidebar
# entry, or a missing doc BEFORE it reaches a release. This workflow does NOT deploy —
# deployment is owned by docs-deploy.yml, gated on a published, non-prerelease release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:build
