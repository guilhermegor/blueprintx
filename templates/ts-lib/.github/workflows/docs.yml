name: Docs - Build Check

# Build the Docusaurus site on every push and PR to catch broken links, a bad sidebar
# entry, or a missing doc BEFORE it reaches a release. This workflow does NOT deploy —
# deployment is owned by docs-deploy.yml, gated on a published, non-prerelease release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:build
