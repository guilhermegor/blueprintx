name: Docs - Deploy (GitHub Pages)

# Deploys the Docusaurus site after a GitHub release publishes — mirrors lib-minimal's
# deploy_docs job (runs only after the package actually shipped, never advertises a
# version that failed to publish). A prerelease (rc/beta/alpha) never moves the
# published site: gated on the release's own `prerelease` flag, not a parsed tag string.
#
# `on: release` alone is not enough: release-npm.yml's github_release job creates the
# release with `github.token`, and GitHub does not start `release: types: [published]`
# workflow runs for events authored by GITHUB_TOKEN (the built-in recursive-run guard —
# see "Triggering a workflow from a workflow" in GitHub's Actions docs). So this workflow
# also exposes a `workflow_call` entry point, and release-npm.yml's `docs_deploy` job
# invokes it directly once the release exists. `on: release` is kept for the case of a
# release published by a human through the UI, which still fires normally.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions" (cannot be scripted
# from a workflow's own GITHUB_TOKEN, which lacks repo-admin rights).

on:
  release:
    types: [published]
  workflow_call:

jobs:
  deploy:
    # workflow_call has no github.event.release context — the caller (release-npm.yml)
    # already decides whether to invoke this at all, so only the `release` trigger needs
    # the prerelease guard.
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
