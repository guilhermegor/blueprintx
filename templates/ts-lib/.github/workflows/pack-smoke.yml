name: Pack Smoke + Verdaccio Rehearsal

# npm's analogue of Test PyPI: no hosted "test npm" exists, and versions are
# immutable once published, so both jobs rehearse a publish without touching the
# real registry or burning a version number.
#
# - pack-smoke: `npm pack` -> install the tarball into a throwaway consumer ->
#   require()/import() it by package name. Catches a broken `exports` map, a
#   missing `files` entry, or a forgotten dependency — ~90% of what Test PyPI
#   catches, with zero infrastructure. Runs on every PR (bin/smoke_pack.sh).
# - verdaccio-rehearsal: a real publish -> install round-trip against a
#   self-hosted Verdaccio registry (service container), exercising actual
#   registry semantics (dist-tags, tarball fetch) that installing a local
#   tarball does not.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run pack:smoke

  verdaccio-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      verdaccio:
        image: verdaccio/verdaccio:5
        ports:
          - 4873:4873
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Wait for Verdaccio to be ready
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4873/-/ping >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Verdaccio did not become ready in time" && exit 1

      # Verdaccio's default config allows any client to register a user and
      # publish — no external account needed for this rehearsal.
      - name: Create a throwaway Verdaccio user token
        run: |
          response=$(curl -s -X PUT http://localhost:4873/-/user/org.couchdb.user:rehearsal \
            -H "Content-Type: application/json" \
            -d '{"name":"rehearsal","password":"rehearsal-pw","email":"rehearsal@example.com"}')
          token=$(node -p "JSON.parse(process.argv[1]).token" "$response")
          echo "//localhost:4873/:_authToken=$token" > .npmrc.verdaccio

      - name: Publish to Verdaccio
        run: npm publish --registry http://localhost:4873 --userconfig ./.npmrc.verdaccio

      - name: Install from Verdaccio into a throwaway consumer and smoke it
        run: |
          pkg_name=$(node -p "require('./package.json').name")
          consumer_dir=$(mktemp -d)
          printf '{"name":"verdaccio-consumer","private":true}\n' > "$consumer_dir/package.json"
          (cd "$consumer_dir" && npm install "$pkg_name" \
            --registry http://localhost:4873 --no-audit --no-fund)
          node -e "
            const pkg = require('$consumer_dir/node_modules/$pkg_name');
            if (pkg.greet('World') !== 'Hello, World!') {
              throw new Error('Verdaccio publish/install round-trip smoke failed');
            }
          "
