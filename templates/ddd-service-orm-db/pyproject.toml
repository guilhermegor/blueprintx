[tool.poetry]
name = "${PROJECT_NAME}"
version = "${PROJECT_VERSION}"
description = "${PROJECT_DESCRIPTION}"
authors = []
readme = "README.md"
license = "${PROJECT_LICENSE}"
homepage = "${HOMEPAGE}"
repository = "${REPOSITORY}"
keywords = ["python"]
package-mode = false
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.poetry.urls]
"Bug Reports" = "${BUG_REPORTS_URL}"
"Source" = "${SOURCE_URL}"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# Runtime type-checking engine behind src/chassis/typing. A main (not dev) dependency:
# production code imports it via @type_checker / metaclass=TypeChecker.
beartype = ">=0.22"
python-dotenv = ">=1.0.0"
sqlalchemy = ">=2.0"
alembic = ">=1.13.0"
# Used only by the schema-less-storage opt-in (chassis/db_wschema/infrastructure/
# joblib_handler.py, shipped together with chassis/db on that prompt). blueprintx#274: the
# scaffold prunes this line when that opt-in is declined (scaffold_prune_optin_dependency in
# bin/lib/scaffold_python_templates.sh) -- when it survives scaffolding it IS imported, so it
# never needs a DEP002 ignore. Previously missing here entirely, which meant accepting the
# storage opt-in shipped an unimportable joblib_handler.py (no declared dependency at all).
joblib = ">=1.3"
# The tabular vocabulary utils/{dtypes,frames,decimals,provenance,tabular_reader}.py speak.
#
# ⚠️ DECLARED BECAUSE IT IS IMPORTED — not because it was missing from the install. Until
# blueprintx#238 put deptry on this tier, pandas reached those five modules ONLY through
# `wwdates`, a business-day calendar that happens to depend on it. That is the failure mode
# lib-minimal/CLAUDE.md warns about, in the shipped template: a calendar library dropping
# pandas is an ordinary release note, and it would have broken every DDD project with an
# ImportError that appears in nobody's diff.
pandas = ">=2.0"
# Imported by chassis/typing/policy.py to widen `int` to numpy.integer. It is behind a
# `try/except ModuleNotFoundError` degrade, which is why it went undeclared — but a guarded
# import is still an import, and the same rule applies.
numpy = ">=1.22"
# BR ANBIMA business-day calendar (wrapped by utils/dates.py). Single-purpose package.
wwdates = ">=1.0.0"
# Hardened XML parsing at the ingestion trust boundary (utils/xml_reader.py), blueprintx#117.
defusedxml = ">=0.7"
# Microsoft Teams incoming-webhook transport, used by the webhook opt-in (teams adapter).
# blueprintx#274: the scaffold prunes this line when the webhook opt-in is declined -- when
# it survives scaffolding it IS imported (optional/webhook ships as one package), so it
# never needs a DEP002 ignore.
pymsteams = ">=0.2.5"
# YAML config parsing (inputs/outputs/webhooks .yaml) in src/config.
pyyaml = ">=6.0"
# Outlook desktop COM automation (utils/ms_office/outlook_gateway); Windows-only at install time.
pywin32 = {version = ">=306", markers = "sys_platform == 'win32'"}
# DB driver is added by the scaffold based on the chosen backend:
#   postgresql  → psycopg[binary]>=3.2.4
#   mysql       → pymysql>=1.1.0
#   mariadb     → mariadb>=1.1.0

[tool.poetry.group.dev.dependencies]
# The task runner (Poe the Poet). Every project command is a task in poe_tasks.toml.
#
# ⚠️ A dev-dep lives in .venv, so it cannot run the tasks that CREATE .venv. Bootstrap
# (`init`, `venv`, `ensure_env`, `precommit`) runs the shell entrypoint directly:
# `bash bin/venv.sh`. Do NOT add `[tool.poetry.requires-plugins]` to reach them — it breaks
# `poetry install` (blueprintx#232 carries the measurement).
poethepoet = ">=0.35"
pre-commit = ">=4.1.0"
pretty-errors = ">=1.2.25"
commitizen = ">=4.4.1"
# Pinned to the ruff-pre-commit hook minor (.pre-commit-config.yaml) so `poe lint`
# and the hook never disagree on formatting/lints.
ruff = ">=0.11.13,<0.12"
codespell = ">=2.4.1"
pydocstyle = ">=6.3.0"
pytest = ">=8.0.0"
# Declared explicitly (not borrowed transitively): tests/unit/test_outlook_gateway.py
# imports pytest_mock. It shipped only because a former umbrella dependency happened to pull it.
pytest-mock = ">=3.12.0"
pytest-cov = ">=6.0.0"
coverage = ">=7.6.0"
# genbadge replaces the abandoned coverage-badge (it imported the removed
# pkg_resources and breaks on setuptools >= 81).
genbadge = {extras = ["coverage"], version = ">=1.1.0"}
# Static type-checker + non-Python lint gates (mirrored in .pre-commit-config and
# `poe lint`). shellcheck + shfmt are pip dev-deps (shellcheck-py/shfmt-py); lint_shell.sh resolves them via poetry run, falls back to a system binary, then skips.
mypy = ">=1.8.0"
sqlfluff = ">=3.0.0"
yamllint = ">=1.35.0"
shfmt-py = ">=3.7.0"
shellcheck-py = ">=0.10.0"
# Direct-dependency gate (bin/lint_deps.sh): every package src/ imports must be declared here.
deptry = ">=0.20"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
mike = ">=2.1.0"
pymdown-extensions = ">=10.0"

# deptry — the direct-dependency gate (bin/lint_deps.sh, run by `poe lint`, pre-commit and CI).
#
# ⚠️ THIS BLOCK CANNOT MOVE TO A SHARED deptry.toml, however much the one-implementation rule
# pulls that way. `--config <file>` re-points deptry at that file as the MANIFEST as well as the
# settings, so it stops reading the dependency table above: measured, it fell back to
# requirements.txt (which pins only Poetry) and relabelled beartype, python-dotenv, wwdates and
# every DB driver as transitive. Settings and dependency list must come from the same file.
[tool.deptry]
# src/main.py and src/app/bootstrap.py import `src.…`. Without this, deptry looks for a
# distribution named "src" and reports DEP001 on both.
known_first_party = ["src"]

[tool.deptry.package_module_name_map]
# pywin32 installs modules whose names share no prefix with the distribution, and it is absent
# off Windows (marker `sys_platform == 'win32'`), so deptry cannot read the mapping from
# installed metadata and guesses "pywin32". Without this line every Linux/macOS run reports
# DEP001 win32com three times in utils/ms_office/outlook_gateway.py AND DEP002 on pywin32 itself.
pywin32 = ["win32com", "win32api", "pythoncom", "pywintypes"]

[tool.deptry.per_rule_ignores]
# DEP002 = declared but never imported. Every entry carries its reason, exactly as
# .layer-policy.yaml requires one: an entry without a reason is a rule the next person widens.
#
# alembic — a migration COMMAND (`alembic upgrade head`), invoked as a CLI and never imported.
# No scaffold change could make this one visible to deptry, so the entry is permanent.
#
# pymsteams is no longer ignored: the scaffold now prunes its declaration when the webhook
# opt-in is declined (bin/lib/scaffold_python_templates.sh), so when the line survives
# scaffolding it IS imported, and there is nothing left for DEP002 to flag (blueprintx#274).
DEP002 = ["alembic"]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
