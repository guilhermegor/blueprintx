# `bin/precommit.sh` installs BOTH `commit-msg` and `pre-push`. pre-commit applies a hook to
# EVERY installed git hook type unless a stage is declared, so without this line every static
# gate below (tests, mypy, lint-*, check_*) would run twice: once on commit and again on push.
# The duplication is invisible in the config — the fast hooks correctly carry no `stages:`
# because they belong on commit, and nothing says that silence also enlists them in the push.
# Hooks that belong elsewhere still say so explicitly (`commit-msg`, `pre-push`, `manual`).
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: forbid-new-submodules
      - id: detect-private-key
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: check-merge-conflict
      # Online default. Offline scaffolds (no GitHub remote) swap this for the
      # local `protect-branch` hook via apply_offline_mode, which points the user
      # at `make new_branch`. Online projects also get gh server-side protection.
      - id: no-commit-to-branch
        args:
          - --branch=main
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
        # fixtures are verbatim external bytes — never normalise a captured oracle
        # (stripping trailing spaces / CRLF corrupts the very thing it pins).
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        # fixtures are verbatim external bytes — never normalise a captured oracle.
        exclude: ^tests/fixtures/
      - id: check-xml
      - id: check-yaml
        args:
          - --unsafe
      - id: check-toml
      - id: check-json
        # Every file under .vscode/ is JSONC (VS Code allows // comments): settings.json,
        # extensions.json, and the per-tier tasks.json all carry them. check-json parses
        # strict JSON and would reject the comments, so exclude the whole directory.
        exclude: ^\.vscode/.*\.json$
      - id: check-symlinks
      - id: debug-statements
      - id: check-added-large-files
        args:
          - --maxkb=500
        exclude: (?i)^(data/large/.*|poetry\.lock)$
      - id: check-illegal-windows-names
      - id: check-case-conflict
      - id: name-tests-test
        args:
          - --pytest-test-first

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages:
          - commit-msg
          - manual
        always_run: true

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages:
          - commit-msg
          - manual
        always_run: true

  # module decoupled from ruff, due to DAR absence
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstring conventions)
        args:
          - --select=D412,D417 # missing blank lines between summary/description, missing arg descriptions

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        name: ruff check
        args:
          - --config=ruff.toml
      - id: ruff-format
        name: ruff format
        args:
          - --config=ruff.toml

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: codespell check
        args:
          - --config=.codespellrc

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: lint dockerfiles
        files: (?i).*dockerfile

  - repo: local
    hooks:
      - id: check-unix-filenames
        name: check unix/linux filename validity
        entry: bash bin/check_unix_filenames.sh
        language: system
        types:
          - file

      - id: check-docstrings
        name: docstring type/raises consistency check
        entry: bash bin/poetry_exec.sh run python bin/check_docstrings.py
        language: system
        types:
          - python
        pass_filenames: false

      # Structural gate for the "runtime type-checking everywhere" doctrine — ruff/mypy
      # cannot assert the *presence* of a checker metaclass / @type_checker decorator.
      - id: check-typing
        name: runtime type-checker application check
        entry: bash bin/poetry_exec.sh run python bin/check_typing.py
        language: system
        types:
          - python
        pass_filenames: false

      # Structural gate for the "ingestion stamps provenance" doctrine — a module that
      # references read_table (a contract-checked read) must also reference stamp_provenance,
      # so a bronze row can never ship without its traceability columns.
      - id: check-provenance
        name: ingestion provenance stamp check
        entry: bash bin/poetry_exec.sh run python bin/check_provenance.py
        language: system
        types:
          - python
        pass_filenames: false

      # Cap a function at 60 lines of CODE. Ruff has no per-function line-count rule
      # (PLR0915 counts statements, a different metric), and the docstring is subtracted
      # because this project mandates NumPy docstrings — a raw span would measure how well
      # a function is documented, not how long it is.
      - id: function-length
        name: function length (60 lines, docstring excluded)
        entry: bash bin/poetry_exec.sh run python bin/check_function_length.py
        language: system
        files: \.(py|sh)$
        pass_filenames: false

      # A package that declares __all__ must name every public member its submodules define.
      # The usual introspective test DISCOVERS the family through __all__ and therefore cannot
      # see a member missing from it: the sweep just returns one fewer item and passes by not
      # looking. This walks the FILES instead, so the hole closes.
      # Cyclomatic complexity, with a DIFFERENT ceiling per tree: 1 for tests/, 2 for src/,
      # 8 for bin/. The tests/ number is the load-bearing one — a test with a branch tests two
      # paths and the green never says which ran, so complexity 1 is the mechanical form of
      # "each test asserts one behaviour", a rule tests/CLAUDE.md states in prose and could
      # never enforce. Two ruff invocations, not one config: per-file-ignores can switch a
      # rule off for a path but cannot give it a different max-complexity.
      - id: check-complexity
        name: cyclomatic complexity (tests 1, src 2, bin 8)
        entry: bash bin/check_complexity.sh
        language: system
        files: \.py$
        pass_filenames: false

      - id: check-all-exports
        name: __all__ names every public member
        entry: bash bin/poetry_exec.sh run python bin/check_all_exports.py
        language: system
        types:
          - python
        pass_filenames: false

      # Structural gate against binary floats in ingested source columns. float64 stores
      # 1984223115.42 as 1984223115.4200000762939453125 — an irreversible, silent loss no
      # contract check or eyeballed frame reveals. Use list_decimal_cols (exact Decimal) or
      # text; a genuinely dimensionless value opts out with "# dtype-ok: <reason>".
      - id: check-dtypes
        name: numeric dtype policy check (no binary floats)
        entry: bash bin/poetry_exec.sh run python bin/check_dtypes.py
        language: system
        types:
          - python
        pass_filenames: false

      # Structural gate for the layer-import policy: a third-party dependency is reached
      # through a seam in utils/, never imported by model/view/controller. ruff's banned-api
      # is a BLOCKLIST and by construction cannot catch a vendor nobody thought to list;
      # this is deny-by-default per layer. Self-skips when .layer-policy.yaml is absent.
      - id: check-layer-imports
        name: layer import policy (vendors live behind a seam)
        entry: bash bin/poetry_exec.sh run python bin/check_layer_imports.py
        language: system
        types:
          - python
        pass_filenames: false

      # Structural gate for the canonical docs skeleton — every canonical page (English slug)
      # exists AND is registered in mkdocs.yml nav; MkDocs builds an unregistered page anyway,
      # so it silently vanishes from navigation. Keys on slugs, never localized nav titles.
      - id: check-docs-sections
        name: docs skeleton (slug + nav) check
        entry: bash bin/poetry_exec.sh run python bin/check_docs_sections.py
        language: system
        files: ^(mkdocs\.yml|docs/)
        pass_filenames: false

      # Structural gate for the per-branch work-ledger convention: a branch whose cumulative diff
      # touches src/ or ci paths must add docs/backlog/<kebab>_YYYYMMDD_HHMMSS.md with a checklist.
      # Diffs the INDEX against merge-base so a staged-but-uncommitted ledger counts.
      - id: check-backlog-ledger
        name: work-ledger (docs/backlog) check
        entry: bash bin/poetry_exec.sh run python bin/check_backlog_ledger.py
        language: system
        pass_filenames: false
        always_run: true

      # Structural gate for the documentation-language boundary: prose for a READER may be in
      # the project's locale (README.md, docs/), while code — comments, docstrings, symbol
      # names, commit messages, CI output — stays English. Prose alone was not enough: the rule
      # was breached TWICE in one session, the second time because a sweep grepped only `.py`
      # and left 55 Portuguese comment lines in `src/config/*.yaml`, which then became the
      # convention the next author copied. A partial sweep leaves a PRECEDENT, not just debt.
      # Hence every commented file type, not merely the one the last violation was in.
      - id: check-comment-language
        name: documentation-language boundary (code is English)
        entry: bash bin/poetry_exec.sh run python bin/check_comment_language.py
        language: system
        files: \.(py|ya?ml|sql|sh|toml|cfg|ini)$|\.env\.example$
        exclude: ^docs/

      - id: mypy
        name: mypy (static type check)
        # Run from src/ so it is the single package base (bare config.x/utils.x imports
        # resolve as at runtime); avoids the dual-root "found twice" error on DDD.
        entry: bash -c 'cd src && bash ../bin/poetry_exec.sh run mypy --config-file ../mypy.ini .'
        language: system
        types:
          - python
        pass_filenames: false

      # Non-Python lint gates share a single wrapper with `make lint` (one home,
      # zero drift). Each wrapper skips gracefully when its tool is absent.
      - id: lint-shell
        name: shellcheck + shfmt (shell lint)
        entry: bash bin/lint_shell.sh --check
        language: system
        types:
          - shell
        pass_filenames: false

      - id: lint-yaml
        name: yamllint (yaml style)
        entry: bash bin/lint_yaml.sh
        language: system
        types:
          - yaml
        pass_filenames: false

      - id: lint-sql
        name: sqlfluff (sql lint)
        entry: bash bin/lint_sql.sh
        language: system
        types:
          - sql
        pass_filenames: false

      # yamllint validates YAML; actionlint validates a WORKFLOW — different questions, and
      # only the second is the one GitHub asks. A workflow can be impeccable YAML and still be
      # rejected wholesale by GitHub, which produces NO red check: the PR just looks like it is
      # waiting, so a dead gate and a slow gate are indistinguishable from the outside.
      - id: lint-actions
        name: actionlint (github actions workflows)
        entry: bash bin/lint_actions.sh
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
        pass_filenames: false

      # `|| [ $? -eq 5 ]` tolerates pytest exit 5 ("no tests collected") so a
      # fresh project with an empty suite does not block every commit; real
      # failures (exit 1) still block.
      - id: unit-tests
        name: checking unit tests
        entry: bash -c "bash bin/poetry_exec.sh run pytest tests/unit/ || [ $? -eq 5 ]"
        language: system
        types:
          - file
        pass_filenames: false

      - id: integration-tests
        name: checking integration tests
        entry: bash -c "bash bin/poetry_exec.sh run pytest tests/integration/ || [ $? -eq 5 ]"
        language: system
        types:
          - file
        pass_filenames: false

      # A non-empty index at push time is the fingerprint of a REJECTED commit: the push then
      # ships the previous commit and prints success, so every signal is green while the work
      # stays behind. Neither CI (a commit that does not exist is not a diff) nor pre-commit
      # (it already rejected; the loss is downstream) can see it. Guards the INDEX, not the
      # dirty tree — unstaged edits while pushing are routine, and a noisy guard gets disabled.
      - id: check-clean-index
        name: pre-push — index must be empty (a rejected commit leaves it populated)
        entry: bash bin/check_clean_index.sh
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push

      # Coverage is the slow full-suite gate — run it on pre-push, not per-commit,
      # so day-to-day commits stay fast (static gates above still run per-commit).
      - id: coverage-check
        name: test coverage check
        # Coverage floor is single-sourced in .coveragerc ([report] fail_under) — read by
        # pytest-cov here and by the CI gate, so there is no duplicated literal to drift.
        entry: bash -c "bash bin/poetry_exec.sh run pytest tests/unit/ --cov=src --cov-report=term-missing"
        language: system
        types:
          - python
        pass_filenames: false
        verbose: true
        stages:
          - pre-push

      # genbadge (not the abandoned coverage-badge, which imports the removed
      # pkg_resources and breaks on setuptools >= 81). Generates coverage.xml then
      # the SVG. coverage.svg is tracked (README badge); coverage.xml is ignored.
      - id: coverage-badge
        name: coverage badge
        entry: bash -c "bash bin/poetry_exec.sh run pytest tests/unit/ --cov=src && bash bin/poetry_exec.sh run coverage xml -o coverage.xml && bash bin/poetry_exec.sh run genbadge coverage --local -i coverage.xml -o coverage.svg"
        language: system
        types:
          - python
        pass_filenames: false
        stages:
          - manual

      - id: check-urls
        name: check urls in docstrings
        entry: bash bin/test_urls_docstrings.sh
        language: system
        types:
          - file
        verbose: true
