services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318" # OTLP/HTTP — matches OTEL_EXPORTER_OTLP_ENDPOINT
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317" # OTLP/gRPC, unused by this seam's HTTP exporter
