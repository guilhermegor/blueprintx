line-length = 99
indent-width = 4
target-version = "py311"
exclude = [
    ".bzr",
    ".git",
    ".git-rewrite",
    ".hg",
    ".svn",

    "__pycache__",
    "__pypackages__",
    ".eggs",
    "*.egg",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",

    ".direnv",
    ".env",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    "venv",
    "site-packages",

    "_build",
    "buck-out",
    "build",
    "dist",

    ".ipynb_checkpoints",
    ".vscode",

    "migrations",

    ".pants.d",
    ".pyenv",
    "node_modules",
    "*.log",
]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
docstring-code-line-length = 79

[lint]
preview = true

select = [
    "UP",
    "E",
    "F",
    "ANN",
    "B",
    "SIM",
    "I",
    "AIR",
    "ERA",
    "S",
    "PD",
    "D",
    "TID",
    "W",
    "PL",
    "PT",
    "RET",
    "A",
    "BLE",
    "N",
    "PLR1702",
]
ignore = [
    "PLC1901",
    "S404",
]
fixable = ["I"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.pylint]
max-args = 8
max-positional-args = 1

[lint.pydocstyle]
convention = "numpy"

[lint.flake8-annotations]
suppress-none-returning = false
suppress-dummy-args = false
ignore-fully-untyped = false
allow-star-arg-any = false

[lint.per-file-ignores]
"bin/**/*.py" = ["PLC2701"]

"tests/**/*.py" = [
    "S101",
    "PLC2701",
    "PLR2004",
]
