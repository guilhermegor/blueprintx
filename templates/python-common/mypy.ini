# mypy configuration — standalone per-tool config (like ruff.toml / .codespellrc),
# not a pyproject [tool.mypy] block. See CLAUDE.md "Tooling".
#
# IMPORTANT: mypy is invoked with `src/` as the working directory
# (`cd src && mypy --config-file ../mypy.ini .` — see the Makefile/tasks.sh/pre-commit
# `mypy` entries). This makes `src` the single package base, so the app's bare imports
# (`config.x`, `utils.x`, `model.x`, …) resolve exactly as they do at runtime
# (`pythonpath = . src` in pytest.ini). Running mypy from the repo root with both
# `mypy_path = src` and `files = src` makes the repo root AND `src` competing bases, so
# a file resolves twice ("Source file found twice under different module names") on the
# deeper DDD tree — running from `src` avoids that.
[mypy]
explicit_package_bases = True
namespace_packages = True
# NO `python_version` pin — deliberate. Pinning it below the running interpreter makes mypy
# parse the *installed* third-party stubs (which belong to that interpreter) under older
# syntax rules. Concretely: on Python 3.12 Poetry resolves numpy>=2.5, whose `.pyi` files use
# PEP 695 `type` statements; `python_version = 3.10` then fails with "Type statement is only
# supported in Python 3.12 and greater" on numpy/__init__.pyi — in every tier that imports
# pandas. Capping numpy would only move the break to the next dependency to adopt PEP 695.
# The requires-python floor is enforced where it is actually sound: the CI 3.10 matrix leg,
# which runs mypy *on* 3.10 against a floor-compatible dependency set. Version-too-new syntax
# in our own code is additionally caught by ruff's `target-version = py310`.

# Many data/vendor libs ship no type stubs (pandas, openpyxl, wwdates, DB drivers);
# don't fail on their missing types.
ignore_missing_imports = True

# Pragmatic baseline (not --strict): enforce annotations and obvious type errors
# without drowning in the runtime-TypeChecker metaclass machinery. Tighten later.
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# Excluded (paths are relative to src/, the invocation cwd), mirroring ruff.toml:
#   - the runtime type-checking engine (utils/typing or chassis/typing) is intrinsic
#     metaprogramming mypy cannot analyse — the same reason it is ANN401-exempt;
#   - the example chassis handlers / example_feature are reference scaffolding, not
#     production code, and carry deliberate loose typing.
exclude = (?x)(^chassis/|^capabilities/example_feature/|^utils/typing/|_internal/utils/typing/)

# ⚠️ `exclude` above only skips file DISCOVERY — it does NOT apply to a module reached
# through an `import`. So the chassis exclude held only for as long as nothing outside
# chassis imported it, which is a property of the app's wiring, not of this config: the day
# a checked module imports `chassis.*`, all six DB handlers get analysed for the first time
# and their deliberate loose typing surfaces as errors nobody introduced.
#
# Measured: adding `config/query_loader.py` (which imports `database_factory` to read the
# active backend) took the DDD native tier from `Success: no issues found in 31 source files`
# to `Found 20 errors in 5 files (checked 33 source files)` — 2 files added, 20 errors, none
# of them in a file the change touched.
#
# `ignore_errors` is the setting that actually follows the module, so state the intent here
# rather than relying on nothing ever importing the reference scaffolding. The debt those 20
# errors represent is real and tracked separately (blueprintx#190) — this makes it explicit
# instead of accidental.
[mypy-chassis.*]
ignore_errors = True

# Belt-and-braces for the typing engine in both layouts (MVC utils/typing, DDD
# chassis/typing), in case a project removes the path exclude above.
[mypy-utils.typing.*]
ignore_errors = True

[mypy-chassis.typing.*]
ignore_errors = True

# lib-minimal nests the same engine at <pkg>._internal.utils.typing.
[mypy-*._internal.utils.typing.*]
ignore_errors = True
