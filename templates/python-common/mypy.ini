# mypy configuration — standalone per-tool config (like ruff.toml / .codespellrc),
# not a pyproject [tool.mypy] block. See CLAUDE.md "Tooling".
#
# IMPORTANT: mypy is invoked with `src/` as the working directory
# (`cd src && mypy --config-file ../mypy.ini .` — see the Makefile/tasks.sh/pre-commit
# `mypy` entries). This makes `src` the single package base, so the app's bare imports
# (`config.x`, `utils.x`, `model.x`, …) resolve exactly as they do at runtime
# (`pythonpath = . src` in pytest.ini). Running mypy from the repo root with both
# `mypy_path = src` and `files = src` makes the repo root AND `src` competing bases, so
# a file resolves twice ("Source file found twice under different module names") on the
# deeper DDD tree — running from `src` avoids that.
[mypy]
explicit_package_bases = True
namespace_packages = True
# NO `python_version` pin — deliberate. Pinning it below the running interpreter makes mypy
# parse the *installed* third-party stubs (which belong to that interpreter) under older
# syntax rules. Concretely: on Python 3.12 Poetry resolves numpy>=2.5, whose `.pyi` files use
# PEP 695 `type` statements; `python_version = 3.10` then fails with "Type statement is only
# supported in Python 3.12 and greater" on numpy/__init__.pyi — in every tier that imports
# pandas. Capping numpy would only move the break to the next dependency to adopt PEP 695.
# The requires-python floor is enforced where it is actually sound: the CI 3.10 matrix leg,
# which runs mypy *on* 3.10 against a floor-compatible dependency set. Version-too-new syntax
# in our own code is additionally caught by ruff's `target-version = py310`.

# NOT a blanket True (blueprintx#376). A global `ignore_missing_imports = True` cannot
# distinguish "pandas ships no stubs" from "this first-party module does not exist in this
# layout" — it swallowed BOTH, so a genuinely broken first-party import (e.g. a typo'd
# `utils.x`) reported `Success: no issues found`. Narrowed to per-module `[mypy-<vendor>.*]`
# blocks below, derived by MEASUREMENT (flip this line locally, scaffold a real project,
# read which modules actually report `import-not-found`) — never guessed, since a hand-written
# list that misses one turns a green gate red in every generated project on the next scaffold.
ignore_missing_imports = False

# Pragmatic baseline (not --strict): enforce annotations and obvious type errors
# without drowning in the runtime-TypeChecker metaclass machinery. Tighten later.
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# Excluded (paths are relative to src/, the invocation cwd). Only ONE thing is excluded now:
# the runtime type-checking engine (utils/typing or chassis/typing), which is intrinsic
# metaprogramming mypy cannot analyse — the same reason it is ANN401-exempt. Everything else
# the tier ships is checked.
#
# This list now MATCHES ruff.toml's [exclude] again (blueprintx#203): ruff.toml dropped its
# blanket `src/chassis` / `example_feature` exclude too, once the same #190 argument was
# measured against ruff's rule set rather than assumed — see ruff.toml's own [lint] comment
# for the per-rule breakdown (D202/S608/UP007/ANN204/ANN202/F401/SIM117/E101/ERA001/complexity,
# ~230 real findings fixed, plus a handful of narrow per-file ignores where `Any` is honest).
#
# ⚠️ `^chassis/` and `^capabilities/example_feature/` were BOTH removed in blueprintx#190,
# for two different reasons worth keeping apart:
#
#   - chassis was excluded and genuinely unchecked, and 20 type errors had accumulated in
#     the DB handlers while nobody was looking. It ships into every generated DDD project,
#     so "reference scaffolding, deliberate loose typing" was a claim about intent, not
#     about who runs the code. The 20 are fixed; it stays checked.
#   - example_feature was excluded and checked ANYWAY, because `main.py` and
#     `app/container.py` import it — the exclude was suppressing discovery of files the
#     import graph pulled straight back in. Measured: dropping it took the DDD native tier
#     from 58 to 69 checked files with zero new errors. An exclude that excludes nothing is
#     worse than no exclude, because it advertises a protection that is not there.
exclude = (?x)(^utils/typing/|_internal/utils/typing/)

# ⚠️ KEEP BOTH MECHANISMS BELOW — they are not redundant, and the difference is the whole
# lesson of blueprintx#190. `exclude` above filters file DISCOVERY only; it does NOT apply
# to a module reached through an `import`. An exclude therefore holds only while nothing
# outside the excluded tree imports it, which is a property of the app's WIRING, not of this
# config. `ignore_errors` in a per-module section is the setting that follows the module
# however it is reached — so anything that must stay unchecked needs the section, not just
# the path.
#
# Measured on blueprintx#119: adding `config/query_loader.py` (which imports
# `database_factory` to read the active backend, which imports all six DB handlers) took the
# DDD native tier from `Success: no issues found in 31 source files` to `Found 20 errors in
# 5 files` — 2 files added, 20 errors, and NONE of them in a file the change touched. The
# handlers had never been checked; the import edge simply revealed it.
#
# Those 20 are now fixed rather than silenced (blueprintx#190), which is why no
# `[mypy-chassis.*]` section appears here. Do not add one back to quiet a new error: it
# would re-hide the whole tree, including everything already made clean.

# Belt-and-braces for the typing engine in both layouts (MVC utils/typing, DDD
# chassis/typing), in case a project removes the path exclude above.
#
# ⚠️ `ignore_missing_imports` here too, not just `ignore_errors` (blueprintx#376). Every
# shared `src/utils/*.py` helper reaches the engine through ONE `if TYPE_CHECKING: from
# utils.typing import type_checker` line (the try/except that picks `chassis.typing` at
# runtime is invisible to mypy — see src/utils/CLAUDE.md), so mypy always resolves
# `utils.typing`, never `chassis.typing`, regardless of which layout actually ships it.
# On a DDD layout `utils/typing/` genuinely does not exist, and that is a DELIBERATE,
# documented shim — not the accidental first-party breakage this change exists to catch —
# so the missing side of the cross-layout shim is the one first-party import still
# tolerated. Measured across all five tiers: MVC ships `utils/typing` (0 errors either
# way); DDD does not, and narrowing `[mypy]` alone turned every shared `utils/*.py` file
# red until this block also carried `ignore_missing_imports`.
[mypy-utils.typing.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-chassis.typing.*]
ignore_errors = True
ignore_missing_imports = True

# lib-minimal nests the same engine at <pkg>._internal.utils.typing.
[mypy-*._internal.utils.typing.*]
ignore_errors = True
ignore_missing_imports = True

# Stub-less vendor libs actually imported by the shipped templates, one block per module —
# derived by measurement (scaffold + `ignore_missing_imports = False` + read the errors),
# not guessed. Each import site: pandas (utils/dtypes.py, decimals.py, frames.py,
# tabular_reader.py, xml_reader.py, provenance.py; MVC's controller/model/view layers),
# wwdates (utils/dates.py, ANBIMA business-day calendar), defusedxml (utils/xml_reader.py),
# win32com (utils/ms_office/outlook_gateway.py, Outlook COM automation), yaml (config/
# startup.py, PyYAML), pyodbc (the native-DB tiers' MSSQL handler — the only one of the
# five native drivers with no stubs; psycopg/mysql.connector/oracledb/sqlite3 all resolve
# clean and need no entry). openpyxl is named in the templates' own docstrings but never
# actually imported today, so it is deliberately absent — adding an unmeasured entry is the
# same guess this change exists to stop making.
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-wwdates.*]
ignore_missing_imports = True

[mypy-defusedxml.*]
ignore_missing_imports = True

[mypy-win32com.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pyodbc.*]
ignore_missing_imports = True
