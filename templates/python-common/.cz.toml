# Commitizen configuration — conventional-commit driven versioning and changelog.
#
# Lives here rather than in pyproject.toml so the manifest stays close to package identity
# plus dependencies (blueprintx#233). The keys below were byte-identical across all five
# Python tiers, so this is ONE file copied to each, not five copies to keep in sync.
#
# ⚠️ Commitizen resolves its config by trying pyproject.toml FIRST, then .cz.toml. A
# pyproject.toml with no [tool.commitizen] section is skipped, not treated as an answer, so
# this file is found — but if it ever stops being copied, commitizen does NOT fail. Measured:
# `cz version --project` prints "No project information in this project." and exits **0**.
# The symptom is a differently formatted changelog and an unprefixed tag, never a red check.
# That is why bin/ci/scaffold_lint_test.sh asserts the file lands in the generated project.
#
# Consumers: `make bump_version` / `cz bump` (offline tiers), `make changelog` / `cz changelog`,
# the `commitizen` pre-commit hook, the commit-msg hook, and the docs build (which regenerates
# CHANGELOG.md so the published Changelog page tracks the tags).
[tool.commitizen]
# `version_provider = "poetry"` reads the version from pyproject.toml's [tool.poetry] — it
# keeps working with the config in this file, since the provider looks up the manifest by
# project root, not by where the config lives (verified against commitizen directly).
#
# Services keep their version in pyproject.toml (the nominal home), tagged by `cz bump`
# (offline, via `make bump_version`) or the release.yaml workflow (online). The library tier
# takes its version from the git tag via poetry-dynamic-versioning and is released by the CI
# release workflows, never a hand-run bump. Either way `cz changelog` groups commits by tag.
name = "cz_conventional_commits"
version_provider = "poetry"
tag_format = "v$version"
update_changelog_on_bump = true
