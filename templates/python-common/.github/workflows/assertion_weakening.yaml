name: Assertion Weakening

on:
  pull_request:

permissions:
  contents: read

jobs:

  assertion-weakening:
    name: Assertion weakening gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run Assertion Weakening Gate
        run: python bin/check_assertion_weakening.py
