name: Contract Drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Contract drift check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.2.1

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Run Contract Drift Check
        run: poetry run python bin/check_contract_drift.py

      - name: Open or Update Drift Issue
        if: hashFiles('contract_drift_report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s contract_drift_report.md ]; then
            echo "No drift reported — nothing to open."
            exit 0
          fi
          gh label create contract-drift --color b60205 \
            --description "A shipped FileContract no longer matches its live source" --force
          marker='<!-- contract-drift-tracker -->'
          printf '%s\n\n' "$marker" | cat - contract_drift_report.md > drift_issue_body.md
          existing=$(gh issue list --label contract-drift --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            existing=$(gh issue list --state open --search "$marker in:body" \
              --json number --jq '.[0].number // empty')
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift_issue_body.md
          else
            gh issue create --title "Contract drift detected" \
              --label contract-drift --body-file drift_issue_body.md
          fi
