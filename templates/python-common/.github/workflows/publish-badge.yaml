name: Publish Coverage Badge

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-badge
  cancel-in-progress: false

jobs:
  publish-badge:
    name: Publish Coverage Badge
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Skip When A Newer Commit Is On main
        id: tip
        env:
          SHA_RUN: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha_tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$sha_tip" = "$SHA_RUN" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main moved to ${sha_tip}; skipping badge for ${SHA_RUN}."
          fi

      - name: Download Badge
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-badge-ubuntu-latest-3.12
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Push Badge To The badges Branch
        if: steps.tip.outputs.current == 'true'
        env:
          URL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          SHA_RUN: ${{ github.event.workflow_run.head_sha }}
        run: |
          git init -q -b badges out
          cd out
          git remote add origin "$URL_REMOTE"
          git fetch -q --depth=1 origin badges && git reset -q --hard FETCH_HEAD || true
          cp ../coverage.svg coverage.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -q -m "chore: coverage badge for ${SHA_RUN}"
          git push -q origin badges
