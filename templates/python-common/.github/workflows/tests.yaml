name: Run Tests

on:
  # No `outputs:` here on purpose. This used to declare `ready_for_release` as
  # `${{ jobs.test.result == 'success' }}`, which is not a valid workflow_call output value —
  # only `jobs.<id>.outputs.<name>` is in scope there, so the output resolved to the empty
  # string on every run while looking like a working release gate. It had no consumers, and a
  # caller that needs the verdict already has it as `needs.<job>.result`.
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:


  test:
    # ⚠️ The name must carry EVERY matrix axis. With only `os` in it, the 3×5 matrix produced
    # 15 check runs sharing 3 names — and a required status check is resolved BY NAME, so a
    # green leg and a red leg of the same name are indistinguishable to the merge gate. A
    # required check must map to exactly one run, or it is decorative in the worst way: it
    # reports a colour drawn from a run nobody chose.
    name: Run Automated Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history: the work-ledger gate resolves merge-base(HEAD, default) and a
          # shallow clone has no common ancestor to find.
          fetch-depth: 0

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
          virtualenvs-create: true
          version: 2.2.1

      # A gate must not live inside a cache-conditional step: nested under the install's
      # `if: cache-hit != 'true'` this never ran on a warm cache, i.e. it was switched off by
      # exactly the condition that makes it cheap. It also has to run BEFORE the step below
      # rewrites pyproject.toml, so it checks what a developer checks locally rather than a
      # CI-only rewrite of the manifest.
      #
      # Fail loud on a stale lock instead of silently regenerating it. A poetry.lock that no
      # longer matches pyproject.toml means dependencies changed without re-locking;
      # regenerating here would re-resolve and upgrade every dependency to the latest
      # in-range version — a non-reproducible build that can silently pull a breaking
      # release. (A version bump does NOT invalidate the lock, so `make bump_version` never
      # trips this.)
      - name: Check lockfile is in sync
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is out of sync with pyproject.toml — run 'poetry lock' locally and commit the result." >&2
            exit 1
          fi

      - name: Load Cached Virtual Environment
        id: cached-venv
        uses: actions/cache@v4
        with:
          # Cache build outputs only. poetry.lock is a TRACKED file: caching it means a
          # restored cache overwrites the repo's committed lockfile, so anything downstream
          # validates a cache artifact instead of what is in the tree.
          path: .venv
          # The lockfile must be in the key. Hashing pyproject.toml alone makes every
          # lock-only change a cache hit — which is precisely the diff Dependabot's
          # `versioning-strategy: lockfile-only` produces, so every dependency-bump PR would
          # restore a stale .venv, skip the install, and report green while testing the
          # PRE-bump dependency set.
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install Dependencies
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: |
          cp pyproject.toml pyproject.original.toml
          cat pyproject.original.toml | python -c '
          import sys, re, os as _os
          content = sys.stdin.read()
          if _os.name != "nt":
              content = re.sub(r".*platform\s*=\s*\"win32\".*", "", content)
              content = re.sub(r"pywin32\s*=.*\n", "", content)
          print(content)
          ' > pyproject.toml

          # The lockfile check is NOT here — it is an unconditional step above, so a warm
          # cache cannot switch it off.
          echo "No groups to exclude, installing all dependencies"
          poetry install --no-interaction --no-root

          # Restore original pyproject.toml
          mv pyproject.original.toml pyproject.toml
          poetry env activate

      - name: Run Spell Check (codespell)
        if: runner.os == 'Linux'
        run: |
          poetry run codespell .
          if [ $? -ne 0 ]; then
            echo "Typos found! Run 'codespell .' locally to see them."
            exit 1
          fi

      - name: Run Docstring Type Consistency Check
        if: runner.os == 'Linux'
        run: |
          poetry run python -m pydocstyle --select=D412,D417 --match="(src|tests).*\\.py" src/ tests/
          poetry run python bin/check_docstrings.py

      - name: Run Runtime Type-Checking Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-typing` pre-commit hook: every src/ class/function carries the
        # runtime checker (TypeChecker metaclass / @type_checker), Pydantic models excepted.
        # CI runs its gates as explicit steps, not via pre-commit, so this must be listed
        # here or a hook-skipping contributor bypasses the check entirely.
        run: poetry run python bin/check_typing.py

      - name: Run Ingestion Provenance Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-provenance` pre-commit hook: a module referencing read_table (a
        # contract-checked read) must also reference stamp_provenance, so a bronze row never
        # ships without its traceability columns. CI runs its gates as explicit steps, not via
        # pre-commit, so this must be listed here or a hook-skipping contributor bypasses it.
        run: poetry run python bin/check_provenance.py

      - name: Run __all__ Export Completeness Check
        if: runner.os == 'Linux'
        # Mirrors the `check-all-exports` pre-commit hook: a package declaring __all__ must name
        # every public member its submodules define. An introspective test that discovers the
        # family THROUGH __all__ structurally cannot catch a member missing from it. CI runs its
        # gates as explicit steps, not via pre-commit, so this must be listed here or a
        # hook-skipping contributor bypasses it.
        run: poetry run python bin/check_all_exports.py

      - name: Run Numeric Dtype Policy Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-dtypes` pre-commit hook: no ingested source column may be typed
        # as a binary float, which stores 1984223115.42 as 1984223115.4200000762939453125 —
        # irreversible and silent. CI runs its gates as explicit steps, not via pre-commit, so
        # this must be listed here or a hook-skipping contributor bypasses it.
        run: poetry run python bin/check_dtypes.py

      - name: Run Layer Import Policy Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-layer-imports` pre-commit hook: a third-party dependency is
        # reached through a seam in utils/, never imported by model/view/controller — in ANY
        # scope, since deferring an import into a function does not undo the coupling. CI runs
        # its gates as explicit steps, not via pre-commit, so this must be listed here or a
        # hook-skipping contributor bypasses it.
        run: poetry run python bin/check_layer_imports.py

      - name: Run Documentation-Language Boundary Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-comment-language` pre-commit hook: prose for a READER may be in the
        # project's locale, while code — comments, docstrings, symbol names — stays English.
        # Runs in AUDIT mode here (no filenames), which sweeps every commented file type rather
        # than only what a given commit staged: the failure this guards against is a PARTIAL
        # sweep leaving a precedent that the next author copies, so the CI pass must be total.
        run: poetry run python bin/check_comment_language.py

      - name: Run Function Length Gate
        if: runner.os == 'Linux'
        # Mirrors the `function-length` pre-commit hook. CI runs its gates as explicit steps,
        # not via pre-commit, so this must be listed here or a hook-skipping contributor
        # bypasses it. Audit mode (no filenames) sweeps the whole tree rather than only what
        # was staged, and FAILS when discovery matches zero files.
        run: poetry run python bin/check_function_length.py

      - name: Run Docs Skeleton Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-docs-sections` pre-commit hook: every canonical page (English slug)
        # exists and is registered in mkdocs.yml nav. CI runs its gates as explicit steps, not via
        # pre-commit, so this must be listed here or a hook-skipping contributor bypasses it.
        run: poetry run python bin/check_docs_sections.py

      - name: Run Work-Ledger Enforcement
        if: runner.os == 'Linux'
        # Mirrors the `check-backlog-ledger` pre-commit hook: a branch touching src/ or ci paths
        # must carry a docs/backlog ledger. CI runs its gates as explicit steps, not via
        # pre-commit, so this must be listed here or a hook-skipping contributor bypasses it.
        run: poetry run python bin/check_backlog_ledger.py

      - name: Run Ruff Linting
        if: runner.os == 'Linux'
        run: |
          poetry run ruff check src/ tests/ --config=ruff.toml
          if [ $? -ne 0 ]; then
            echo "Ruff found issues! Run 'ruff check src/ tests/' locally see details."
            echo "To fix automatically, run: poetry run ruff check --fix src/ tests/"
            exit 1
          fi

      - name: Run Ruff Format Check
        if: runner.os == 'Linux'
        # Mirrors the `ruff-format` pre-commit hook — CI must fail on unformatted code,
        # not just flag lint issues. Fix locally with `poetry run ruff format src/ tests/`.
        run: poetry run ruff format --check src/ tests/ --config=ruff.toml

      - name: Run Static Type Check (mypy)
        if: runner.os == 'Linux'
        # Run from src/ so it is the single package base (avoids the dual-root
        # "found twice" error on the deeper DDD tree).
        run: cd src && poetry run mypy --config-file ../mypy.ini .

      - name: Run Non-Python Lint Gates (shell, sql, yaml, actions)
        if: runner.os == 'Linux'
        # Mirrors `make lint` and the pre-commit lint-* hooks (one home, zero drift).
        # shellcheck/shfmt are system tools; install them so the shell gate actually runs
        # in CI (the wrappers skip gracefully on a box without them).
        #
        # actionlint: the graceful skip is correct on a contributor's machine and is PLACEBO
        # in CI — a gate reporting its own blindness as OK. LINT_ACTIONS_REQUIRED=1 turns the
        # skip into a failure, so a broken install can never read as a passing gate.
        #
        # ⚠️ Pinning the version pins what is ASKED FOR, never what ARRIVES — and what arrives
        # is unpacked and EXECUTED on the runner. Hence the SHA-256 check before extracting.
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          poetry run pip install shfmt-py >/dev/null 2>&1 || true
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          bash bin/lint_shell.sh --check
          bash bin/lint_sql.sh
          bash bin/lint_yaml.sh
          LINT_ACTIONS_REQUIRED=1 bash bin/lint_actions.sh

      - name: Run Integration Tests
        # `|| [ $? -eq 5 ]` tolerates pytest exit 5 ("no tests collected") so a
        # fresh project with an empty integration suite does not fail CI; real
        # failures (exit 1) still fail the step.
        run: poetry run pytest tests/integration/ -v || [ $? -eq 5 ]

      - name: Run Unit Tests
        run: poetry run pytest tests/unit/ || [ $? -eq 5 ]

      - name: Run Coverage Gate
        if: runner.os == 'Linux'
        # Enforce the coverage floor (`.coveragerc` [report] fail_under) on every PR,
        # mirroring the pre-commit `coverage-check` hook. The badge step below runs only on
        # main/tags, so without this a PR could drop coverage below the floor uncaught.
        run: poetry run pytest tests/unit/ --cov=src --cov-report=term-missing || [ $? -eq 5 ]

      - name: Run Coverage Report
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          poetry run pytest --cov=src --cov-report=xml --no-header -q tests/unit/
          # --local renders the SVG from coverage.xml offline. The default form fetches
          # the badge from img.shields.io, so a DNS flake on this cosmetic step could fail
          # (or, on a fail-fast release matrix, silently SKIP) the run. Nothing on a CI/
          # release path may depend on a non-essential external host.
          poetry run genbadge coverage --local -i coverage.xml -o coverage.svg

      - name: Upload Badge
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.svg
