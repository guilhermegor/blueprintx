name: Review Threads

# ⚠️ THE TRIGGERS ARE THE WHOLE POINT OF THIS FILE.
#
# This check used to live inside `scaffold_checks.yml`, which runs on `pull_request` — an event
# that fires on open/synchronize/reopen, i.e. WHEN YOU PUSH. It does NOT fire when a reviewer
# posts a comment. So the verdict was computed at push time and went stale the moment a review
# landed: the check stayed green, showing a conclusion drawn from a PR state that no longer
# existed.
#
# Measured upstream: the gate ran, passed, and two review threads arrived AFTERWARDS. Nothing
# re-evaluated, the PR merged with both open and unanswered, and every visible signal was green.
# A stale check is indistinguishable from a passing one — which is why re-running on the events
# that actually change the answer is not an optimisation, it is the correctness condition.
#
# `pull_request_review` fires when a review is submitted; `pull_request_review_comment` fires on
# an individual inline comment. (`pull_request_review_thread` is a real WEBHOOK event but NOT a
# workflow trigger — adding it makes GitHub reject this file wholesale, with no red check to say
# so. See the BlueprintX issue #156. `bin/lint_actions.sh` catches that class now.)
#
# Kept out of `tests.yaml` on purpose: a review comment must not re-run the full test matrix. One job, a few seconds, as often as needed.
#
# ⚠️ KNOWN CEILING — RESOLUTION DOES NOT RE-TRIGGER THIS.
# `pull_request_review_comment` fires on a comment, never on a thread being RESOLVED. Resolution
# is reported only as the `pull_request_review_thread` webhook, which is not a workflow trigger.
# So the honest sequence is: you reply (this runs, and correctly FAILS — still unresolved), you
# resolve, and nothing re-runs. The check sits stale-red on a PR that is actually finished.
# Measured: after resolving, the job had to be re-run by hand before it went green.
#
# ⚠️ THE SECOND HALF OF THAT CEILING (blueprintx#263 — the same sentence with the emphasis
# moved). The stale red does not merely SIT there: it PERSISTS IN THE ROLLUP even once a
# re-trigger did happen and passed, because every trigger opens a NEW check run and branch
# protection aggregates them. Measured upstream — one push-time failure plus SEVEN later
# successes at the same head still read `mergeStateStatus=BLOCKED statusCheckRollup=FAILURE` —
# and the count SCALES, because each reply re-fires the gate before the last thread is resolved.
# The `Clear stale failed runs` step below now re-runs exactly those stale failures, which is
# the manual step that was measured to flip the PR to CLEAN. The hand re-run after a resolve is
# still needed once — but it now cleans up all the others instead of being repeated per run.
#
# ⚠️ SUPERSEDED 2026-08-17 (blueprintx#173). This block used to conclude "that is why this must
# NOT be a required check". That conclusion was WRONG, and it was load-bearing: while it stood,
# `REQUIRED_CHECKS` in bin/enable_repo_rules.sh shipped EMPTY, so a generated project ran its CI
# and blocked nothing. Measured upstream: a PR merged with 32 of 47 checks passed.
#
# The reasoning was only half right. The ceiling above is real — resolution cannot re-trigger a
# workflow — but this job did not ASSERT resolution: it ran with
# `REVIEW_THREADS_REQUIRE_RESOLVED=0` and asserted only that every thread got a REPLY, and a reply
# DOES re-trigger it via `pull_request_review_comment`. It also runs `on: pull_request`, so it
# reports on every PR from the moment it opens — the property a required check must have. That is
# why `bin/enable_repo_rules.sh` now seeds REQUIRED_CHECKS with this job's `name:`.
#
# ⚠️ SUPERSEDED 2026-08-24 (blueprintx#196). `REVIEW_THREADS_REQUIRE_RESOLVED` IS NOW `1`.
#
# The split below handed the RESOLVE half to the ruleset's `required_review_thread_resolution`
# (`required_conversation_resolution` on classic branch protection) on the reasoning that a
# merge-time setting cannot go stale. True — and it does not check what it was given: GitHub
# DROPS AN OUTDATED THREAD from the blocking set. Measured upstream: the merge button was ENABLED
# over a thread reading `resolved=False outdated=True`, with 29 of 29 checks green and the
# setting confirmed `enabled`. A thread outdates when the author's own commit rewrites the lines
# it points at, so the reachable sequence is: reply thinly, rewrite those lines, merge. The half
# nobody could re-evaluate was also the half nobody was checking.
#
# So this job now asserts BOTH halves and pays the ceiling above in full: after you resolve, this
# check stays RED until the run is re-run by hand. That is a deliberate trade, not an oversight.
# Set the value back to "0" below if your project prefers the reply-only contract.
#
# The split as it stood (kept for the reasoning, no longer the configuration):
#   - THIS job (REQUIRED): catches a missing REPLY, live, because a comment re-triggers it.
#   - the ruleset's `required_review_thread_resolution`: catches a missing RESOLVE at the merge
#     button — for every thread EXCEPT an outdated one.
#   - the local `pr_merge_threads_guard.sh` PreToolUse hook: both halves, queried live at the
#     moment of `gh pr merge`.
#
# ⚠️ SUPERSEDED 2026-08-22 (#216). This block used to say `cancel-in-progress` must stay
# **false** below because a cancelled run publishes a `cancelled` conclusion. There is no
# concurrency block at all now, and the reason is worse than that: see the note above `jobs:`.
# `false` does not stop a QUEUED run being cancelled by the next one, and a run cancelled before
# it starts publishes NOTHING — leaving the required context `Expected — Waiting for status to
# be reported`, which no re-run clears.
# Closing this properly inside Actions needs a webhook receiver or GitHub App dispatching a
# `repository_dispatch` on `resolved`; not worth a always-on listener for this repo.
on:
  pull_request:
  pull_request_review:
  pull_request_review_comment:

permissions:
  contents: read
  pull-requests: read
  # `actions: write` is for the stale-run cleanup step below — re-running a run is an Actions
  # write. Nothing else in this workflow needs it.
  actions: write

# ⚠️ NO `concurrency:` BLOCK, DELIBERATELY — DO NOT "TIDY THIS UP".
#
# There was one, keyed on the PR with `cancel-in-progress: false`, on the reasoning that only the
# latest verdict matters and that `false` made it safe for a required check. Both halves were
# wrong, and the second is wrong in a way the old note understated.
#
# `cancel-in-progress: false` does NOT mean "nothing gets cancelled". It means a RUNNING job is
# not cancelled — but only ONE run may sit PENDING per group, so each newly queued run cancels
# the one already waiting. Answering three review threads in one burst produced **10 runs in 25
# seconds** on blueprintx#216: five `success`, five `cancelled`.
#
# And a run cancelled while still QUEUED never starts, so it publishes no check run at all. The
# required context is then left `Expected — Waiting for status to be reported` — not red, which
# you could re-run, but UNREPORTED, which nothing clears: resolving a thread emits no workflow
# trigger, and re-running a sibling run does not satisfy the expectation. The PR sits BLOCKED
# with every visible check green and no failure to point at. That is strictly worse than the
# `cancelled` conclusion the old note predicted, because there is nothing to click.
#
# The job is a few seconds of one runner. Letting every event have its own run costs less than
# one deadlock, and it is the only shape that cannot exhibit this at all.

jobs:

  review-threads:
    name: Review threads answered
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      # A finding takes BOTH halves: reply with what changed and why, then resolve the thread.
      # Neither half is optional and neither implies the other — a reviewer bot resolves its own
      # threads on seeing the fix, so `isResolved` records ITS satisfaction, never the author's
      # reasoning; and a reply on a thread nobody closed leaves the exchange indistinguishable
      # from one still in progress.
      #
      # The server-side ruleset (`required_conversation_resolution`) enforces only the resolve
      # half, and only at the merge button. This is the half a setting cannot express.
      - name: Every review thread is answered and resolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # BOTH halves — see the KNOWN CEILING block at the top of the file for the trade.
          REVIEW_THREADS_REQUIRE_RESOLVED: "1"
        run: python bin/check_review_threads.py

      # ⚠️ THE PUSH-TIME FAILURE OUTLIVES ITS OWN VERDICT (blueprintx#263).
      # Each trigger above creates a NEW check run; branch protection reads the AGGREGATE. So a
      # run that failed correctly at push time keeps the PR BLOCKED behind any number of later
      # passes. Re-running only the stale failures is what flips it to CLEAN — measured upstream
      # by hand three times before it was automated here, and the count SCALES with how many
      # threads you answer (1, then 5, then 7 on three consecutive PRs).
      #
      # `if: success()` is the loop guard, not decoration: this may only ever run from a run
      # that PASSED, or it would re-run itself forever. The script skips $GITHUB_RUN_ID too.
      - name: Clear stale failed runs of this gate at the same head
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash bin/rerun_stale_gate_runs.sh
