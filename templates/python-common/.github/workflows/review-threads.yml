name: Review Threads

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["Review Threads"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

concurrency:
  group: review-gate-${{ (github.event.pull_request.head.repo.fork && startsWith(github.event_name, 'pull_request_review') && github.run_id) || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:

  record-fork-review:
    name: Record fork review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    if: >-
      startsWith(github.event_name, 'pull_request_review') &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - run: echo "Review recorded; the workflow_run relay re-runs the gate in the base repo."

  review-gate-runner:
    name: Review gate runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
      gate_outcome: ${{ steps.gate.outcome }}
      head_stable: ${{ steps.stable.outputs.stable }}
      pr_number: ${{ steps.pr.outputs.number }}
    if: >-
      (github.event_name == 'workflow_run' &&
      startsWith(github.event.workflow_run.event, 'pull_request_review') &&
      github.event.workflow_run.head_repository.full_name != github.repository) ||
      (github.event_name != 'workflow_run' &&
      !(startsWith(github.event_name, 'pull_request_review') &&
      github.event.pull_request.head.repo.full_name != github.repository) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve the PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ steps.pr.outputs.number }}
          RELAY_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RELAY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_PR_NUMBER" ]; then
            echo "number=$EVENT_PR_NUMBER" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$RELAY_HEAD_REPO" ] && [ -n "$RELAY_HEAD_BRANCH" ] || { echo "::error::no PR number and no workflow_run head"; exit 1; }
          str_number=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=open \
            -f head="${RELAY_HEAD_REPO%%/*}:${RELAY_HEAD_BRANCH}" \
            --jq '[.[] | select(.head.repo.full_name == env.RELAY_HEAD_REPO) | .number][0] // empty')
          if [ -z "$str_number" ]; then
            echo "::notice::no open PR for ${RELAY_HEAD_REPO}; nothing to relay"
            exit 0
          fi
          [[ "$str_number" =~ ^[0-9]+$ ]] || { echo "::error::unexpected PR number"; exit 1; }
          echo "number=$str_number" >>"$GITHUB_OUTPUT"

      - name: Resolve the head SHA once, before the gate runs
        id: head
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          str_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          [ -n "$str_head" ] || { echo "::error::could not resolve head SHA for PR ${PR_NUMBER}"; exit 1; }
          echo "sha=$str_head" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Every review thread is answered and resolved
        id: gate
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_THREADS_REQUIRE_RESOLVED: "1"
          EVALUATED_HEAD: ${{ steps.head.outputs.sha }}
          CHECKED_HEAD_FILE: ${{ runner.temp }}/checked_head
        run: python bin/check_review_threads.py

      - name: Confirm the head did not move while the gate ran
        id: stable
        if: "!cancelled() && steps.head.outcome == 'success'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STR_HEAD: ${{ steps.head.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          str_now=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null) || str_now=""
          if [ "$str_now" = "$STR_HEAD" ]; then echo "stable=true" >> "$GITHUB_OUTPUT"; else echo "stable=false" >> "$GITHUB_OUTPUT"; fi

      - name: Post the required result as a check-run on the PR head
        if: "!cancelled() && steps.head.outputs.sha != ''"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          EVALUATED_HEAD: ${{ steps.head.outputs.sha }}
          CHECKED_HEAD_FILE: ${{ runner.temp }}/checked_head
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          str_conclusion=failure
          str_title="Unanswered or unresolved review threads"
          if [ "$GATE_OUTCOME" = "success" ]; then
            str_conclusion=success
            str_title="Every review thread is answered and resolved"
          fi
          if [ "$str_conclusion" = success ] && [ "$(cat "$CHECKED_HEAD_FILE" 2>/dev/null)" != "$EVALUATED_HEAD" ]; then
            str_conclusion=failure
            str_title="Gate evaluated a different head than the one read at start"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -X POST \
            -f name="Review threads answered" \
            -f head_sha="$EVALUATED_HEAD" \
            -f status=completed \
            -f conclusion="$str_conclusion" \
            -f details_url="$RUN_URL" \
            -f "output[title]=$str_title" \
            -f "output[summary]=Gate outcome: ${GATE_OUTCOME:-did not run}. Run: $RUN_URL"

      - name: Fail this job when the gate did not pass
        if: steps.pr.outputs.number != '' && steps.gate.outcome != 'success'
        run: exit 1

  publish-app-check:
    name: Publish the review-gate App check
    needs: review-gate-runner
    if: "!cancelled() && needs.review-gate-runner.result != 'skipped' && needs.review-gate-runner.outputs.pr_number != ''"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: review-app-check-${{ github.event.pull_request.number || github.event.issue.number }}-${{ needs.review-gate-runner.outputs.head_sha }}
      cancel-in-progress: false
    env:
      REVIEW_APP_CONFIGURED: ${{ secrets.REVIEW_APP_CLIENT_ID != '' && secrets.REVIEW_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Fail when the gate job produced no head SHA
        if: "env.REVIEW_APP_CONFIGURED == 'true' && needs.review-gate-runner.outputs.head_sha == ''"
        run: echo "::error::the gate job resolved no head SHA, so no App check was published" && exit 1

      - name: Review-gate App not configured, check stays on GITHUB_TOKEN
        if: env.REVIEW_APP_CONFIGURED != 'true'
        run: echo "::notice::REVIEW_APP_CLIENT_ID / REVIEW_APP_PRIVATE_KEY not set or not available to this run (fork and Dependabot pull_request runs get no secrets), skipping the GitHub App check publisher (blueprintx#1318)"

      - name: Mint the review-gate App token (only when the App is configured)
        id: app
        if: "env.REVIEW_APP_CONFIGURED == 'true' && needs.review-gate-runner.outputs.head_sha != ''"
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Publish the check run from the review-gate App
        if: "env.REVIEW_APP_CONFIGURED == 'true' && steps.app.outcome == 'success'"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STR_HEAD: ${{ needs.review-gate-runner.outputs.head_sha }}
          GATE_OUTCOME: ${{ needs.review-gate-runner.outputs.gate_outcome }}
          HEAD_STABLE: ${{ needs.review-gate-runner.outputs.head_stable }}
        run: |
          set -euo pipefail
          str_conclusion=failure
          if [ "$GATE_OUTCOME" = success ] && [ "$HEAD_STABLE" = true ]; then str_conclusion=success; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Review threads answered" -f head_sha="$STR_HEAD" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f status=completed -f conclusion="$str_conclusion" \
            -f "output[title]=Review threads answered" \
            -f "output[summary]=Published by the review-gate GitHub App (gate step: ${GATE_OUTCOME}, head unchanged: ${HEAD_STABLE:-unknown})"
