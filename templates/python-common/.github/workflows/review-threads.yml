name: Review Threads

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:

  review-threads:
    name: Review threads answered
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVIEW_APP_CONFIGURED: ${{ secrets.REVIEW_APP_CLIENT_ID != '' && secrets.REVIEW_APP_PRIVATE_KEY != '' }}
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Resolve the head SHA once, before the gate runs
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          str_head="$EVENT_HEAD_SHA"
          if [ -z "$str_head" ]; then
            str_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          fi
          [ -n "$str_head" ] || { echo "::error::could not resolve head SHA for PR ${PR_NUMBER}"; exit 1; }
          echo "sha=$str_head" >> "$GITHUB_OUTPUT"

      - name: Review-gate App not configured, check stays on GITHUB_TOKEN
        if: env.REVIEW_APP_CONFIGURED != 'true'
        run: echo "::notice::REVIEW_APP_CLIENT_ID / REVIEW_APP_PRIVATE_KEY not set or not available to this run (fork and Dependabot pull_request runs get no secrets), skipping the GitHub App check publisher (blueprintx#1318)"

      - name: Every review thread is answered and resolved
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_THREADS_REQUIRE_RESOLVED: "1"
        run: python bin/check_review_threads.py

      - name: Clear stale failed runs of this gate at the same head
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STR_HEAD: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          str_head="$STR_HEAD"
          [ -n "$str_head" ] || { echo "::error::empty head SHA"; exit 1; }
          HEAD_SHA="$str_head" bash bin/rerun_stale_gate_runs.sh

      - name: Mint the review-gate App token (only when the App is configured)
        id: app
        if: always() && env.REVIEW_APP_CONFIGURED == 'true' && steps.head.outcome == 'success'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Publish the check run from the review-gate App
        if: always() && env.REVIEW_APP_CONFIGURED == 'true' && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STR_HEAD: ${{ steps.head.outputs.sha }}
          JOB_STATUS: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          str_head="$STR_HEAD"
          case "$JOB_STATUS" in
            success) str_conclusion=success ;;
            cancelled) str_conclusion=cancelled ;;
            *) str_conclusion=failure ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Review threads answered" -f head_sha="$str_head" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f status=completed -f conclusion="$str_conclusion" \
            -f "output[title]=Review threads answered" \
            -f "output[summary]=Published by the review-gate GitHub App (gate step: ${JOB_STATUS})"
