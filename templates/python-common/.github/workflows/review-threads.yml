name: Review Threads

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:

  review-gate-runner:
    name: Review gate runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Every review thread is answered and resolved
        id: gate
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_THREADS_REQUIRE_RESOLVED: "1"
        run: python bin/check_review_threads.py

      - name: Post the required result as a check-run on the PR head
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          str_conclusion=failure
          str_title="Unanswered or unresolved review threads"
          if [ "$GATE_OUTCOME" = "success" ]; then
            str_conclusion=success
            str_title="Every review thread is answered and resolved"
          fi
          str_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          [ -n "$str_head" ] || { echo "::error::could not resolve head SHA for PR ${PR_NUMBER}"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -X POST \
            -f name="Review threads answered" \
            -f head_sha="$str_head" \
            -f status=completed \
            -f conclusion="$str_conclusion" \
            -f details_url="$RUN_URL" \
            -f "output[title]=$str_title" \
            -f "output[summary]=Gate outcome: ${GATE_OUTCOME:-did not run}. Run: $RUN_URL"

      - name: Fail this job when the gate did not pass
        if: steps.gate.outcome != 'success'
        run: exit 1
