name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_run:
    workflows: ["Run Tests", "PR Quality Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-evaluate EVERY open PR (use after changing gate policy)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'pull_request'
    name: Classify and gate this PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Surface a missing ruleset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/enable_repo_rules.sh check_ruleset

      - name: Run PR gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_AXES: "tests,lint,code scanning"
        run: python bin/pr_gate.py

  late_rerun:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'PR Quality Gate'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'failure'
    name: Re-run a gate that failed after the retrigger gave up
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run the failed gate once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          int_open="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
            --jq "[.[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\")] | length")"
          if [ "${int_open:-0}" -eq 0 ]; then
            echo "$HEAD_SHA is no open PR's head; nothing to re-run"
            exit 0
          fi
          int_pending="$(gh run list --commit "$HEAD_SHA" --limit 100 --json name,status,event \
            --jq '[.[] | select(.name == "Run Tests" and .event == "pull_request" and .status != "completed")] | length')"
          if [ "${int_pending:-0}" -gt 0 ]; then
            echo "Run Tests still running for $HEAD_SHA; its completion re-runs the gate"
            exit 0
          fi
          str_run="$(gh run view "$RUN_ID" --json attempt,status,conclusion \
            --jq '"\(.attempt) \(.status) \(.conclusion)"')"
          case "$str_run" in
          "1 completed failure") gh run rerun "$RUN_ID" || echo "re-run already in flight" ;;
          *) echo "gate run $RUN_ID is '$str_run'; nothing to re-run" ;;
          esac

  retrigger:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'Run Tests'
      && github.event.workflow_run.event == 'pull_request'
    name: Re-run a gate that timed out before Run Tests finished
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run the failed gate for this head commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          int_open="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
            --jq "[.[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\")] | length")"
          if [ "${int_open:-0}" -eq 0 ]; then
            echo "$HEAD_SHA is no open PR's head; nothing to re-run"
            exit 0
          fi
          for _ in $(seq 1 18); do
            str_run="$(gh run list --workflow pr-gate.yml --event pull_request \
              --commit "$HEAD_SHA" --limit 1 --json databaseId,status,conclusion,attempt \
              --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion) \(.attempt)"')"
            case "$str_run" in
            *" completed "*) break ;;
            "") break ;;
            esac
            sleep 10
          done
          str_id=""
          case "$str_run" in
          *" completed failure 1" | *" completed cancelled 1" | *" completed timed_out 1") str_id="${str_run%% *}" ;;
          esac
          if [ -z "$str_id" ]; then
            case "$str_run" in
            *" completed "*) echo "gate run for $HEAD_SHA did not fail; nothing to re-run" ;;
            "") echo "no gate run for $HEAD_SHA; nothing to re-run" ;;
            *) echo "::warning::gate run for $HEAD_SHA still $str_run after waiting; not re-run" ;;
            esac
            exit 0
          fi
          gh run rerun "$str_id" || echo "re-run already in flight"

  backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.backfill
    name: Re-evaluate every open PR (policy backfill)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Re-run the gate on all open PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GATE_MAX_POLLS: "1"
        run: |
          for n in $(gh pr list --state open --limit 100 --json number --jq '.[].number'); do
            echo "::group::PR #$n"
            PR_NUMBER="$n" python bin/pr_gate.py ||
              echo "::warning::PR #$n has no final verdict (checks pending or failing); its own next run decides"
            echo "::endgroup::"
          done
