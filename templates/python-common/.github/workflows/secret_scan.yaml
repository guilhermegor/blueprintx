name: Secret Scan

# GitGuardian (blueprintx#155): scans the PR/push range for secrets. Kept in its own file (like
# review_threads.yaml, pr-gate.yaml) rather than a step in tests.yaml, because it needs its own
# secret and its own non-required contract — see the warning below.
#
# ⚠️ NOT wired into bin/enable_repo_rules.sh's REQUIRED_CHECKS. A required status check that
# never reports blocks every PR forever. Per `measure-a-checks-population-before-requiring-it`,
# it stays optional until its population is measured.
#
# blueprintx#287 resolved the "ship by default vs. opt-in" question this file could not make
# for itself: THIS FILE IS OPT-IN, like the webhook/storage prompts. A scaffold's
# copy_github_assets copies it into the new project ONLY when GITGUARDIAN_API_KEY is set in
# the environment at scaffold time — that same presence check is also what makes
# bin/lib/scaffold_git_remote.sh's scaffold_set_secret_scan_key propagate the key to the new
# repo's secrets, mirroring how GH_PAT_REVIEW_TRIGGER already opts a project into
# coderabbit_trigger.yaml's reviewer PAT. A project that never exported the variable never
# receives this workflow at all — no dead job, no failure on its first PR. One already
# scaffolded without it can still opt in later: `gh secret set GITGUARDIAN_API_KEY --repo
# <owner>/<repo>` plus copying this file into `.github/workflows/` by hand. See
# docs/secret-scanning.md for the full walkthrough.
#
# ⚠️ ABSENT KEY MUST FAIL LOUD, NEVER SKIP SILENTLY — same contract as GH_PAT_REVIEW_TRIGGER in
# coderabbit_trigger.yaml. A silent skip here would look exactly like "scanned, found nothing",
# which is the one failure mode this whole feature exists to avoid. `ggshield` already does this
# on its own: with no key it exits 3 with "A GitGuardian API key is needed to use ggshield" —
# distinct from a clean scan's exit 0 — so no extra pre-check is needed here.
#
# ⚠️ ONE decidable exception (blueprintx#457): a Dependabot-authored PR gets a SEPARATE secret
# store GitHub never fills from this repo's ordinary Actions secrets, so even a project whose
# key resolves fine for every human PR trips this job on EVERY Dependabot PR, forever — not a
# finding, the scan never running at all. That is not "misconfigured", it is "cannot run here",
# and the two are kept apart by checking the PR's AUTHOR from the event payload
# (`github.event.pull_request.user.login`, never `github.actor` — the same precedent as
# `bin/check_backlog_ledger.py`'s `is_bot_author`, which warns an actor-keyed exemption
# un-exempts itself the moment a human touches the bot's PR). The skip below is not a silent
# pass either: it prints a `::warning::` naming the reason and the remedy, and `gitleaks`
# (`tests.yaml`'s "Run Secret Scan (gitleaks)" step) already scans this exact range
# unconditionally with no key required, so this repo is not left unscanned.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  secret-scan:
    name: GitGuardian — secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # ggshield needs the full range to diff, not just the tip.
          fetch-depth: 0

      - name: Report and skip — bot-authored PR, no Dependabot secret store entry
        if: >-
          github.event_name == 'pull_request' &&
          endsWith(github.event.pull_request.user.login, '[bot]')
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "::warning::GitGuardian secret scan did NOT run for this PR (author: $PR_AUTHOR)."
          echo "GitHub does not expose this repo's Actions secrets to a Dependabot-triggered run"
          echo "-- only secrets in the separate Dependabot secret store. This is NOT 'scanned,"
          echo "found nothing': gitleaks (see tests.yaml's gitleaks step) already scans this same"
          echo "range unconditionally, no key needed. To close this gap too:"
          echo "  gh secret set GITGUARDIAN_API_KEY --app dependabot --repo <owner>/<repo>"

      - name: Install ggshield
        if: >-
          !(github.event_name == 'pull_request' &&
            endsWith(github.event.pull_request.user.login, '[bot]'))
        run: pipx install ggshield

      - name: Scan the push/PR range for secrets
        # ⚠️ EXACTLY this one variable, and its name is counter-intuitive. Verified
        # against ggshield's own source (core/git_hooks/ci/commit_range.py, v1.54.0), not its
        # docs:
        #   CI_PREVIOUS_COMMIT_VAR[GITHUB] == "GITHUB_PUSH_BASE_SHA"
        # So GITHUB_PUSH_BASE_SHA is the PREVIOUS-COMMIT variable and must carry
        # `github.event.before`. `GITHUB_PUSH_BEFORE_SHA` — the name that reads correct — and
        # `GITHUB_PULL_BASE_SHA` appear NOWHERE in ggshield: setting them protects nothing
        # while looking like it does. `GITHUB_DEFAULT_BRANCH` is gone for the same reason:
        # with the guard below, this step only ever runs with a real previous commit, so
        # ggshield's fallback to it is unreachable — and an unreachable setting reads as
        # protection too. The pull_request path needs nothing here at all, because
        # ggshield reads GITHUB_BASE_REF, which Actions already sets.
        #
        # Without a usable previous commit, `ggshield secret scan ci` falls back to
        # `GITHUB_SHA~1...` — the LAST COMMIT ONLY. A push of five commits gets one scanned
        # and four skipped, exit 0 either way: the "looks exactly like scanned, found
        # nothing" failure this file's header warns about, one level subtler.
        #
        # ⚠️ A branch-CREATING push is excluded here on purpose: `github.event.before` is
        # forty zeroes, and there is no previous commit to diff against. ggshield would then
        # fall back to GITHUB_DEFAULT_BRANCH, which it uses as a BARE ref (`main..<sha>`, no
        # `origin/` prefix — the remote prefix is applied only on the pull_request path). The
        # runner checks out detached with no local `main`, so that resolves to nothing and
        # lands back on `GITHUB_SHA~1...`. Prefixing it with `origin/` does not save it
        # either: on the push that CREATES the branch, `origin/main` already equals HEAD, so
        # the range is empty. The whole repository IS the correct range there — which is
        # exactly the first push of a freshly scaffolded project, the one carrying everything.
        if: >-
          (github.event_name == 'pull_request' &&
           !endsWith(github.event.pull_request.user.login, '[bot]')) ||
          (github.event_name == 'push' &&
           github.event.before != '0000000000000000000000000000000000000000')
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.before }}
        run: ggshield secret scan ci

      - name: Scan the whole repository for secrets
        # Runs for a manual dispatch (no range to diff at all) AND for a branch-creating push
        # (`before` is forty zeroes). Two named steps rather than one branching step, so the
        # Actions log says WHICH scan ran — a range bug is invisible when both modes print the
        # same name. workflow_call keeps the caller's event_name, so a called PR run takes the
        # step above.
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'push' ||
           github.event.before == '0000000000000000000000000000000000000000')
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: ggshield secret scan repo .
