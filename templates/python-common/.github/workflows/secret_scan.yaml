name: Secret Scan

# GitGuardian (blueprintx#155): scans the PR/push range for secrets. Kept in its own file (like
# review_threads.yaml, pr-gate.yaml) rather than a step in tests.yaml, because it needs its own
# secret and its own non-required contract — see the warning below.
#
# ⚠️ NOT wired into bin/enable_repo_rules.sh's REQUIRED_CHECKS. A required status check that
# never reports blocks every PR forever, and this repo's GITGUARDIAN_API_KEY propagation to each
# scaffolded repo (blueprintx#155 scope 2) is not implemented yet — so on a freshly scaffolded
# project this job has no key and cannot report at all until an admin runs
# `gh secret set GITGUARDIAN_API_KEY --repo <owner>/<repo>`. Per
# `measure-a-checks-population-before-requiring-it`, it stays optional until its population is
# measured.
#
# ⚠️ ABSENT KEY MUST FAIL LOUD, NEVER SKIP SILENTLY — same contract as GH_PAT_REVIEW_TRIGGER in
# coderabbit_trigger.yaml. A silent skip here would look exactly like "scanned, found nothing",
# which is the one failure mode this whole feature exists to avoid. `ggshield` already does this
# on its own: with no key it exits 3 with "A GitGuardian API key is needed to use ggshield" —
# distinct from a clean scan's exit 0 — so no extra pre-check is needed here.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  secret-scan:
    name: GitGuardian — secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # ggshield needs the full range to diff, not just the tip.
          fetch-depth: 0

      - name: Install ggshield
        run: pipx install ggshield

      - name: Scan for secrets
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: ggshield secret scan ci
