name: Rerun On Collision

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rerun-on-collision
  cancel-in-progress: false

jobs:
  rerun:
    name: Update PRs that collide with this merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Update colliding PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RERUN_TOKEN: ${{ secrets.RERUN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_BRANCH: main
          RERUN_EXCLUDE_FILES: ${{ vars.RERUN_EXCLUDE_FILES || 'poetry.lock,CHANGELOG.md' }}
        run: python bin/rerun_on_collision.py
