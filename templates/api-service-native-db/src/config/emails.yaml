# send/auto-send are resolved from .env (EMAIL_SEND__<BLOCK> / EMAIL_AUTO_SEND__<BLOCK>,
# blueprintx#121), never from here — a flag in this tracked file would need a branch +
# merge to flip one send off, while .env is git-ignored and machine-local.
example_email:
  subject: "Subject: {}"
  body: |
    Hello,

    {}

    Regards,
  to:
    - "recipient@example.com"
  cc:
  bcc:
