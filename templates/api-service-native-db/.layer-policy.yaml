first_party_extra:
  - chassis

annotation_only:
  pandas: >-
    Annotation only. Build a frame with utils.frames.from_cursor; read one with
    utils.tabular_reader.read_table / read_query (they enforce a FileContract + dtypes).

layers:
  __root__:
    allow:
      uvicorn: "main.py is the process entrypoint; it serves the app the composition root built"

  app:
    allow:
      dotenv: "reads .env while assembling the container; environment resolution is its job"
      fastapi: >-
        api.py builds the ASGI app and mounts each capability's router — the composition
        root is where the HTTP framework and the wired container meet.

  capabilities:
    allow: {}

  capabilities/*/domain:
    allow: {}
    deny_layers:
      app: "the domain must not know the container that wires it."
      chassis.db_schema: "a DB provider is infrastructure; the domain names ports, not providers."
      chassis.db_wschema: "a storage provider is infrastructure; the domain names ports, not providers."
      chassis.webhook: "a notifier is infrastructure; the domain names ports, not providers."
      config: "the domain must not read configuration; it is handed what it needs."
      utils: "a seam is still an outside dependency for a layer whose contract is pure Python."

  capabilities/*/application:
    allow: {}
    deny_layers:
      app: "the use case must not know the container that constructs it."
      chassis.db_schema: "depend on the domain PORT, never on the provider that implements it."
      chassis.db_wschema: "depend on the domain PORT, never on the provider that implements it."
      chassis.webhook: "depend on the domain PORT, never on the provider that implements it."
      config: "configuration is resolved at the composition root and injected."

  capabilities/*/infrastructure:
    allow: {}
    deny_layers:
      app: "an adapter must not know the container that selects it."

  capabilities/*/transport:
    allow:
      fastapi: "HTTP transport adapter — APIRouter, request/response translation."
    deny_layers:
      app: "an inbound adapter must not know the container that wires it; callables are injected."
      chassis.db_schema: "depend on the domain port via an injected callable, never the provider."
      chassis.db_wschema: "depend on the domain port via an injected callable, never the provider."
      chassis.webhook: "depend on the domain port via an injected callable, never the provider."
      config: "configuration is resolved at the composition root and injected."

  chassis:
    allow:
      dotenv: "reads .env when a provider resolves its own configuration"
      psycopg: "PostgreSQL driver behind chassis/db_schema"
      pyodbc: "SQL Server driver behind chassis/db_schema"
      oracledb: "Oracle driver behind chassis/db_schema"
      mysql: "MySQL/MariaDB driver behind chassis/db_schema"
      beartype: "runtime type-checking engine behind chassis.typing"
      numpy: >-
        Optional widening for the runtime type-checker (chassis/typing/policy.py), probed
        with a guarded import so a tier without numpy still loads.
      pandas: "the chassis seam layer owns the pandas surface, as utils/ does in the MVC tiers"
      opentelemetry: >-
        OTLP log export behind chassis/otel_logging.py (opt-in, blueprintx#438). The ONLY
        place this vendor is imported — application code calls configure_otel_logging(logger),
        never opentelemetry directly, so a later exporter swap touches one adapter.
      joblib: >-
        Binary artifact store behind chassis/db_wschema/joblib_handler.py (schema-less storage
        opt-in, blueprintx#650). Application code reaches it through the DatabaseHandler port
        and build_storage_handler(), never joblib directly.

  utils:
    allow:
      pandas: "the seam layer owns the pandas surface (frames, dtypes, tabular_reader)"
      wwdates: "BR business-day calendar, wrapped by utils.dates"
      win32com: "Outlook COM automation, wrapped by utils.ms_office.outlook_gateway (Windows only)"
      requests: "HTTP transport, wrapped by utils.http_downloader"
      urllib3: "retry/backoff policy used by the download seam"
      defusedxml: "hardened XML parsing at the ingestion trust boundary"
      beartype: "runtime type-checking engine behind utils.typing"
      numpy: >-
        Optional widening for the runtime type-checker: utils/typing/policy.py accepts
        numpy integers where int is annotated when WIDEN_INT_TO_NUMPY is on, probed with a
        guarded import so a tier without numpy still loads. Legitimate here precisely
        because utils/ IS the seam layer.

    deny_layers:
      config: >-
        The seam layer must not depend on the composition root that configures it. The other
        direction already exists (config/startup.py imports utils), so this one would close a
        real cycle rather than a hypothetical one.
      capabilities: "utils/ is a seam for the capabilities, not a consumer of them."
      app: "utils/ must not depend on the container that wires it."


  config:
    allow:
      dotenv: "loads .env at startup; this is the layer that owns environment resolution"
      yaml: "parses inputs.yaml / outputs.yaml"
      psycopg: "PostgreSQL driver, imported lazily by the configured DB_BACKEND"
      pyodbc: "SQL Server driver, imported lazily by the configured DB_BACKEND"
      oracledb: "Oracle driver, imported lazily by the configured DB_BACKEND"
      mysql: "MySQL/MariaDB driver, imported lazily by the configured DB_BACKEND"

    deny_layers:
      capabilities: "config/ is read by the capabilities; it must not import one back."
      app: "config/ is read while assembling; it must not depend on the assembler."
