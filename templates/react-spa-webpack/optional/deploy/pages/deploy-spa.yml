name: Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Build with GH Pages basepath
        env:
          PUBLIC_PATH: /${{ env.REPO_NAME }}/
        run: npm run build

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll on Pages
        run: touch dist/.nojekyll

      - name: Prepare gh-pages working dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p gh-pages-work
          cd gh-pages-work
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "${REMOTE_URL}" gh-pages > /dev/null; then
            git clone --branch gh-pages --depth 1 "${REMOTE_URL}" .
          else
            git init -b gh-pages
            git remote add origin "${REMOTE_URL}"
          fi

      - name: Sync dist/ into gh-pages working dir
        run: rsync -av --delete --exclude='.git' dist/ gh-pages-work/

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages-work
          git add .
          git diff-index --quiet HEAD -- || git commit -m "deploy: SPA build from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
