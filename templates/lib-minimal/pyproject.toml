[tool.poetry]
name = "${PROJECT_NAME}"
version = "${PROJECT_VERSION}"
description = "${PROJECT_DESCRIPTION}"
authors = ["${AUTHOR_NAME}"]
readme = "README.md"
license = "${PROJECT_LICENSE}"
homepage = "${HOMEPAGE}"
repository = "${REPOSITORY}"
keywords = ["${PROJECT_NAME}", "python", "library"]
packages = [{ include = "${PROJECT_PKG_NAME}", from = "src" }]
exclude = ["src/**/CLAUDE.md"]
package-mode = true
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "${PROJECT_LICENSE_CLASSIFIER}",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[tool.poetry.urls]
"Bug Reports" = "${BUG_REPORTS_URL}"
"Source" = "${SOURCE_URL}"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
beartype = ">=0.22"
pandas = ">=2.1.0"
numpy = ">=1.22"
openpyxl = ">=3.1.0"
defusedxml = ">=0.7"

[tool.poetry.group.dev.dependencies]
poethepoet = ">=0.35"
pre-commit = ">=4.1.0"
pretty-errors = ">=1.2.25"
commitizen = ">=4.4.1"
build = ">=1.2.2"
twine = ">=6.1.0"
ruff = ">=0.11.13,<0.12"
codespell = ">=2.4.1"
pydocstyle = ">=6.3.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
pytest-randomly = ">=3.15.0"
coverage = ">=7.6.0"
genbadge = {extras = ["coverage"], version = ">=1.1.0"}
mypy = ">=1.8.0"
sqlfluff = ">=3.0.0"
yamllint = ">=1.35.0"
shfmt-py = ">=3.7.0"
shellcheck-py = ">=0.10.0"
deptry = ">=0.20"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
pymdown-extensions = ">=10.0"
mike = ">=2.1.0"

[tool.deptry.per_rule_ignores]
DEP002 = ["openpyxl"]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
