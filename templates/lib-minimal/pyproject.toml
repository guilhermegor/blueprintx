[tool.poetry]
name = "${PROJECT_NAME}"
# The version source depends on how this project was scaffolded. OFFLINE (no remote): this static
# version, hand-bumped via `poe bump_version`. ONLINE (GitHub remote): the scaffold rewrote this
# to a "0.0.0" stub + poetry-dynamic-versioning, so the published version comes from the git tag
# (vX.Y.Z) and `poe bump_version` is removed (the CI release workflows cut releases by tagging).
version = "${PROJECT_VERSION}"
description = "${PROJECT_DESCRIPTION}"
authors = ["${AUTHOR_NAME}"]
readme = "README.md"
license = "${PROJECT_LICENSE}"
homepage = "${HOMEPAGE}"
repository = "${REPOSITORY}"
keywords = ["${PROJECT_NAME}", "python", "library"]
packages = [{ include = "${PROJECT_PKG_NAME}", from = "src" }]
# Keep internal dev docs out of the distributed wheel/sdist.
exclude = ["src/**/CLAUDE.md"]
package-mode = true
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "${PROJECT_LICENSE_CLASSIFIER}",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[tool.poetry.urls]
"Bug Reports" = "${BUG_REPORTS_URL}"
"Source" = "${SOURCE_URL}"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# Runtime type-checking engine behind _internal/utils/typing. A main (not dev) dependency:
# library code imports it via @type_checker / metaclass=TypeChecker, so it must ship to
# consumers of the wheel.
beartype = ">=0.22"
# Required by the private _internal helpers (dtypes / tabular_reader / config.contracts).
pandas = ">=2.1.0"
# Imported by _internal/utils/typing/policy.py to widen `int` to numpy.integer. It is behind a
# `try/except ModuleNotFoundError` degrade, which is why it went undeclared until
# blueprintx#238 — but a guarded import is still an import, and the same rule applies. It
# matters more here than in the service tiers: this wheel SHIPS, so an undeclared import
# becomes a consumer's ImportError, not just a contributor's.
numpy = ">=1.22"
openpyxl = ">=3.1.0"

[tool.poetry.group.dev.dependencies]
# The task runner (Poe the Poet). Every project command is a task in poe_tasks.toml.
#
# ⚠️ A dev-dep lives in .venv, so it cannot run the tasks that CREATE .venv. Bootstrap
# (`init`, `venv`, `ensure_env`, `precommit`) runs the shell entrypoint directly:
# `bash bin/venv.sh`. Do NOT add `[tool.poetry.requires-plugins]` to reach them — it breaks
# `poetry install` (blueprintx#232 carries the measurement).
poethepoet = ">=0.35"
pre-commit = ">=4.1.0"
pretty-errors = ">=1.2.25"
commitizen = ">=4.4.1"
# Build + publish tooling for the PyPI / Test-PyPI release workflows (twine is the
# publish fallback when `poetry publish` is unavailable).
build = ">=1.2.2"
twine = ">=6.1.0"
# Pinned to the ruff-pre-commit hook minor (.pre-commit-config.yaml) so `poe lint`
# and the hook never disagree on formatting/lints.
ruff = ">=0.11.13,<0.12"
codespell = ">=2.4.1"
pydocstyle = ">=6.3.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
coverage = ">=7.6.0"
# genbadge replaces the abandoned coverage-badge (it imported the removed
# pkg_resources and breaks on setuptools >= 81).
genbadge = {extras = ["coverage"], version = ">=1.1.0"}
# Static type-checker + non-Python lint gates (mirrored in .pre-commit-config and
# `poe lint`). shellcheck + shfmt are pip dev-deps (shellcheck-py/shfmt-py); lint_shell.sh resolves them via poetry run, falls back to a system binary, then skips.
mypy = ">=1.8.0"
sqlfluff = ">=3.0.0"
yamllint = ">=1.35.0"
shfmt-py = ">=3.7.0"
shellcheck-py = ">=0.10.0"
# Direct-dependency gate (bin/lint_deps.sh): every package src/ imports must be declared here.
deptry = ">=0.20"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
pymdown-extensions = ">=10.0"
# Versioned docs: the release workflow runs `mike deploy <X.Y> latest` after a PyPI publish,
# so a consumer pinned to an old release still gets that release's docs. Serves from gh-pages.
mike = ">=2.1.0"

# deptry — the direct-dependency gate (bin/lint_deps.sh, run by `poe lint`, pre-commit and CI).
# This tier is the reason the gate exists: CLAUDE.md's "every imported package is a direct
# dependency" was written HERE, and until blueprintx#238 nothing checked it.
#
# ⚠️ THIS BLOCK CANNOT MOVE TO A SHARED deptry.toml, however much the one-implementation rule
# pulls that way. `--config <file>` re-points deptry at that file as the MANIFEST as well as the
# settings, so it stops reading the dependency table above: measured, it fell back to
# requirements.txt (which pins only Poetry) and relabelled real dependencies as transitive.
# Settings and dependency list must come from the same file.
[tool.deptry.per_rule_ignores]
# DEP002 = declared but never imported. Every entry carries its reason, exactly as
# .layer-policy.yaml requires one: an entry without a reason is a rule the next person widens.
#
# openpyxl — reached as a pandas ENGINE STRING (`df.to_excel(..., engine="openpyxl")`), never
# imported by name, so deptry structurally cannot see the use. Permanent entry: no scaffold
# change would make it visible. It is still a genuine runtime dependency, hence declared.
DEP002 = ["openpyxl"]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
