name: Close linked issues

# Closes the issues a merged PR delivered when GitHub's own "Closes #N" linking did not.
# Rules and rationale: BlueprintX docs, FAQ (blueprintx#604).
on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    # A fork PR gets a read-only token, so it cannot close anything here.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close referenced issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Untrusted text goes through env, never interpolated into the script.
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          from_branch=""
          case "$BRANCH" in
            dependabot/*|renovate/*) ;;
            *)
              # <type>/<N>-<slug> first; a trailing -N only when that form is absent.
              from_branch=$(printf '%s' "$BRANCH" | sed -nE 's|^[A-Za-z]+/([0-9]+)-.*|\1|p')
              if [ -z "$from_branch" ]; then
                from_branch=$(printf '%s' "$BRANCH" | grep -oE -- '-[0-9]+$' | tr -d '-' || true)
              fi
              ;;
          esac
          from_body=$(printf '%s' "$BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' || true)

          for n in $(printf '%s\n%s\n' "$from_branch" "$from_body" | sed 's/^0*\([0-9]\)/\1/' | sort -un); do
            [ "$n" = "$PR" ] && continue
            # The issues endpoint also answers for PR numbers; those are skipped.
            state=$(gh api "repos/$GH_REPO/issues/$n" \
              --jq 'if .pull_request then "pr" else .state end' 2>/dev/null) || continue
            if [ "$state" = "open" ]; then
              gh issue close "$n" --reason completed --comment "Delivered in #$PR."
              echo "closed #$n"
            else
              echo "#$n is $state, skipped"
            fi
          done
