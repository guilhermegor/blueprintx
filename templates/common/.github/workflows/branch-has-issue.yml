name: Branch has issue

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, assigned, unassigned]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Require an issue number in the branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash bin/check_pr_policy.sh branch
      - name: Require an assignee
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ASSIGNEES=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER" --jq '[.assignees[].login] | join(" ")') || ASSIGNEES=
          export ASSIGNEES
          bash bin/check_pr_policy.sh assignee
      - name: Require a linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          TRACKER: ${{ vars.PR_TRACKER || 'github' }}
          TRACKER_REGEX: ${{ vars.PR_TRACKER_REGEX }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CLOSING_COUNT=$(gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){closingIssuesReferences(first:1){totalCount}}}}' \
            --jq .data.repository.pullRequest.closingIssuesReferences.totalCount) || CLOSING_COUNT=0
          export CLOSING_COUNT
          bash bin/check_pr_policy.sh linked-issue
