name: Delete closed PR branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: delete-closed-pr-branch-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  delete:
    permissions:
      contents: write
      pull-requests: read
    if: >-
      github.event.pull_request.merged == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref != github.event.repository.default_branch
      && github.event.pull_request.head.ref != github.event.pull_request.base.ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: bash bin/delete_closed_pr_branch.sh
