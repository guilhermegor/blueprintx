name: Delete closed PR branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -u
          url="repos/${GH_REPO}/git/refs/heads/${BRANCH}"
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          if ! tip="$(gh api "$url" --jq .object.sha 2>&1)"; then
            if [[ "$tip" == *"HTTP 404"* ]]; then
              note "Branch \`${BRANCH}\` of PR #${PR} is already deleted; nothing to do."
              exit 0
            fi
            echo "$tip" >&2
            exit 1
          fi

          if [[ "$tip" != "$HEAD_SHA" ]]; then
            note "Kept \`${BRANCH}\`: its tip \`${tip}\` is not the PR #${PR} head \`${HEAD_SHA}\`."
            exit 0
          fi

          if out="$(gh api -X DELETE "$url" 2>&1)"; then
            note "Deleted \`${BRANCH}\` at \`${tip}\` (PR #${PR} closed without merge)."
          elif [[ "$out" == *"HTTP 404"* || "$out" == *"HTTP 422"* ]]; then
            note "Branch \`${BRANCH}\` was already gone or refused deletion: ${out}"
            exit 0
          else
            echo "$out" >&2
            exit 1
          fi
          note "Restore: PR #${PR} page, 'Restore branch', or \`git push origin ${tip}:refs/heads/${BRANCH}\`."
