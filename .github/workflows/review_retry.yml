name: Review Retry

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the chosen PR instead of posting a request (blueprintx#280)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-retry-${{ github.repository }}
  cancel-in-progress: false

jobs:

  retry:
    name: Re-ask a rate-limited reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Re-request a review where the reviewer was rate limited
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 templates/python-common/bin/retry_rate_limited_review.py --dry-run
          else
            python3 templates/python-common/bin/retry_rate_limited_review.py
          fi
