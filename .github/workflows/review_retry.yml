name: Review Retry

# Re-ask for a review on any open PR whose reviewer was RATE LIMITED, not absent.
#
# ⚠️ WHAT THIS IS NOT: it does not relax the review gate. `review_threads.yml` stays exactly as
# strict — a PR with no review on its head commit still fails. What this removes is the part a
# human was doing by hand: waiting out the reviewer's window, then re-typing the request.
#
# The number that chose this design over an escape hatch in the gate (measured over 112 PRs,
# blueprintx#234): **19 PRs hit a rate limit and 18 of them were reviewed in the end.** A rate
# limit is a DELAY, so automate the asking; an unavailability would have needed the gate to
# forgive it, and the 19th PR is why it must not — #157 merged with zero reviews while a
# rate-limit notice stood, which is precisely the #204/#213 hole the gate was built to close.
#
# Once the review lands, the gate re-runs on `pull_request_review` and the stale red runs are
# cleared by `bin/rerun_stale_gate_runs.sh` (blueprintx#263). So the PR goes green unattended,
# and no verdict was ever weakened to get there.
#
# ⚠️ SCHEDULE, NOT AN EVENT — AND THAT IS THE ONLY SHAPE THAT WORKS. The state being repaired
# is "the reviewer declined a moment ago and will accept later", so the trigger has to be the
# passage of time. No PR event fires while a PR sits waiting. Measured windows on this repo are
# 10–25 minutes (the "47 minutes" recorded earlier was an outlier), so `*/10` clears most of
# them on the first tick after the window.
#
# ⚠️ IT NEEDS THE USER PAT, exactly like `coderabbit_trigger.yml`, and for the measured reason:
# CodeRabbit IGNORES bot-authored comments (#210 — 5 minutes, no reply, silently dropped). The
# script reads back the comment's author `type` and warns loudly if it posted as a Bot, because
# a dropped request that reports success is worse than no request at all.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the chosen PR instead of posting a request (blueprintx#280)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Two ticks must not both pass the marker check and post duplicate requests. `false`, not
  # `true`: a queued run should WAIT and then re-read the comments — by which time our marker
  # exists and it correctly skips — rather than cancel a run that may already have posted.
  #
  # ⚠️ THIS DOES NOT CONTRADICT THE "NO CONCURRENCY" RULE IN `review_threads`. That rule exists
  # because a queued run cancelled before it starts publishes NO check run, leaving a REQUIRED
  # context stuck on `Expected — Waiting for status`. This workflow is a janitor on a timer and
  # publishes no verdict anyone waits on, which is the same reason `coderabbit_trigger` may
  # carry a concurrency group. Class of workflow, not blanket rule.
  group: review-retry-${{ github.repository }}
  cancel-in-progress: false

jobs:

  retry:
    name: Re-ask a rate-limited reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      # No secret-shape preflight here, unlike `coderabbit_trigger.yml`: that workflow must fail
      # loudly because a missing PAT means a PR is never reviewed at all. This one is a janitor
      # on a timer — if the PAT is missing the gate still blocks the PR, visibly, and a failing
      # scheduled job every 10 minutes would be pure noise. The script warns and exits 0.
      #
      # ⚠️ ONE ASK PER RUN, OLDEST-FIRST — blueprintx#280. The script itself now enumerates every
      # open PR, applies the account-level quota block, and asks at most ONE (the oldest waiting
      # PR under the attempt cap) before returning — this step never loops or fans out. `*/10`
      # above is therefore the only rate limiter left, matching the shared account's ~1
      # review/hour budget far better than the old "ask everyone eligible" sweep did.
      - name: Re-request a review where the reviewer was rate limited
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 templates/python-common/bin/retry_rate_limited_review.py --dry-run
          else
            python3 templates/python-common/bin/retry_rate_limited_review.py
          fi
