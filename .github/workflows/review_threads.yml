name: Review Threads

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:

  review-threads:
    name: Review threads answered
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
      gate_outcome: ${{ steps.gate.outcome }}
      head_stable: ${{ steps.stable.outputs.stable }}
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the head SHA once, before the gate runs
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          str_head="$EVENT_HEAD_SHA"
          if [ -z "$str_head" ]; then
            str_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          fi
          [ -n "$str_head" ] || { echo "::error::could not resolve head SHA for PR ${PR_NUMBER}"; exit 1; }
          echo "sha=$str_head" >> "$GITHUB_OUTPUT"

      - name: Gate files unchanged, or the owner approved the change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          str_files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          str_hit=$(printf '%s\n' "$str_files" | grep -Fx \
            -e .github/workflows/review_threads.yml \
            -e templates/common/bin/check_review_threads.py \
            -e templates/python-common/.github/workflows/review-threads.yml \
            -e templates/ts-common/.github/workflows/review-threads.yml \
            -e .review-bots.yaml \
            -e templates/python-common/.review-bots.yaml \
            -e templates/ts-common/.github/.review-bots.yaml || true)
          [ -n "$str_hit" ] || exit 0
          str_labels=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')
          if printf '%s\n' "$str_labels" | grep -Fxq gate-change-approved; then
            echo "::notice::review-thread gate files changed, approved by the gate-change-approved label"
            exit 0
          fi
          echo "::error::PR edits review-thread gate files; the owner must add the gate-change-approved label:"
          printf '%s\n' "$str_hit"
          exit 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Every review thread is answered and resolved
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_THREADS_REQUIRE_RESOLVED: "1"
        run: python3 templates/common/bin/check_review_threads.py

      - name: Confirm the head did not move while the gate ran
        id: stable
        if: "!cancelled() && steps.head.outcome == 'success'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STR_HEAD: ${{ steps.head.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          str_now=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null) || str_now=""
          if [ "$str_now" = "$STR_HEAD" ]; then echo "stable=true" >> "$GITHUB_OUTPUT"; else echo "stable=false" >> "$GITHUB_OUTPUT"; fi

      - name: Clear stale failed runs of this gate at the same head
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STR_HEAD: ${{ steps.head.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          str_head="$STR_HEAD"
          [ -n "$str_head" ] || { echo "::error::empty head SHA for PR ${PR_NUMBER}"; exit 1; }
          HEAD_SHA="$str_head" bash templates/python-common/bin/rerun_stale_gate_runs.sh

  publish-app-check:
    name: Publish the review-gate App check
    needs: review-threads
    if: "!cancelled() && needs.review-threads.result != 'skipped'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: review-app-check-${{ github.event.pull_request.number || github.event.issue.number }}-${{ needs.review-threads.outputs.head_sha }}
      cancel-in-progress: false
    env:
      REVIEW_APP_CONFIGURED: ${{ secrets.REVIEW_APP_CLIENT_ID != '' && secrets.REVIEW_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Fail when the gate job produced no head SHA
        if: "env.REVIEW_APP_CONFIGURED == 'true' && needs.review-threads.outputs.head_sha == ''"
        run: echo "::error::the gate job resolved no head SHA, so no App check was published" && exit 1

      - name: Review-gate App not configured, check stays on GITHUB_TOKEN
        if: env.REVIEW_APP_CONFIGURED != 'true'
        run: echo "::notice::REVIEW_APP_CLIENT_ID / REVIEW_APP_PRIVATE_KEY not set or not available to this run (fork and Dependabot pull_request runs get no secrets), skipping the GitHub App check publisher (blueprintx#1318)"

      - name: Mint the review-gate App token (only when the App is configured)
        id: app
        if: "env.REVIEW_APP_CONFIGURED == 'true' && needs.review-threads.outputs.head_sha != ''"
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Publish the check run from the review-gate App
        if: "env.REVIEW_APP_CONFIGURED == 'true' && steps.app.outcome == 'success'"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STR_HEAD: ${{ needs.review-threads.outputs.head_sha }}
          GATE_OUTCOME: ${{ needs.review-threads.outputs.gate_outcome }}
          HEAD_STABLE: ${{ needs.review-threads.outputs.head_stable }}
        run: |
          set -euo pipefail
          str_conclusion=failure
          if [ "$GATE_OUTCOME" = success ] && [ "$HEAD_STABLE" = true ]; then str_conclusion=success; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Review threads answered" -f head_sha="$STR_HEAD" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f status=completed -f conclusion="$str_conclusion" \
            -f "output[title]=Review threads answered" \
            -f "output[summary]=Published by the review-gate GitHub App (gate step: ${GATE_OUTCOME}, head unchanged: ${HEAD_STABLE:-unknown})"
