name: Review Threads

# ⚠️ THE TRIGGERS ARE THE WHOLE POINT OF THIS FILE.
#
# This check used to live inside `scaffold_checks.yml`, which runs on `pull_request` — an event
# that fires on open/synchronize/reopen, i.e. WHEN YOU PUSH. It does NOT fire when a reviewer
# posts a comment. So the verdict was computed at push time and went stale the moment a review
# landed: the check stayed green, showing a conclusion drawn from a PR state that no longer
# existed.
#
# Measured on PR #180: the gate ran, passed, and two review threads arrived AFTERWARDS. Nothing
# re-evaluated, the PR merged with both open and unanswered, and every visible signal was green.
# A stale check is indistinguishable from a passing one — which is why re-running on the events
# that actually change the answer is not an optimisation, it is the correctness condition.
#
# `pull_request_review` fires when a review is submitted; `pull_request_review_comment` fires on
# an individual inline comment. (`pull_request_review_thread` is a real WEBHOOK event but NOT a
# workflow trigger — adding it makes GitHub reject this file wholesale, with no red check to say
# so. See blueprintx#156. `bin/ci/check_actions.sh` catches that class now.)
#
# Kept out of `scaffold_checks.yml` on purpose: a review comment must not re-run the 29-job
# scaffold matrix. One job, a few seconds, as often as needed.
#
# ⚠️ KNOWN CEILING — RESOLUTION DOES NOT RE-TRIGGER THIS.
# `pull_request_review_comment` fires on a comment, never on a thread being RESOLVED. Resolution
# is reported only as the `pull_request_review_thread` webhook, which is not a workflow trigger.
# So the honest sequence is: you reply (this runs, and correctly FAILS — still unresolved), you
# resolve, and nothing re-runs. The check sits stale-red on a PR that is actually finished.
# Measured: after resolving, the job had to be re-run by hand before it went green.
#
# That is why this must NOT be a required check — a required check that cannot refresh itself
# blocks every PR forever. The layering is what makes it sound, each covering the other's gap:
#   - THIS job: catches a missing REPLY, live, because a comment does re-trigger it.
#   - the `required_conversation_resolution` ruleset: catches a missing RESOLVE, live, at the
#     merge button — exactly the half this job cannot refresh.
#   - the local `pr_merge_threads_guard.sh` PreToolUse hook: both halves, queried live at the
#     moment of `gh pr merge`, which is the only instant that can never be stale.
# Closing this properly inside Actions needs a webhook receiver or GitHub App dispatching a
# `repository_dispatch` on `resolved`; not worth a always-on listener for this repo.
on:
  pull_request:
  pull_request_review:
  pull_request_review_comment:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Keyed on the PR, not the ref: several review comments can land in seconds and only the
  # latest verdict matters.
  #
  # ⚠️ cancel-in-progress MUST stay false now that this is a REQUIRED check. A cancelled run
  # still publishes a check run under this job's name, with conclusion `cancelled` — which is
  # not success, so the merge gate reads red and there is no event left to turn it green
  # (measured on PR #185: a `pull_request_review` run cancelled a `pull_request` one and the
  # PR sat BLOCKED on a verdict nobody produced). Queueing costs a few seconds; cancelling
  # costs a deadlock that looks exactly like a real failure.
  group: review-threads-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:

  review-threads:
    name: Review threads answered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      # A finding takes BOTH halves: reply with what changed and why, then resolve the thread.
      # Neither half is optional and neither implies the other — a reviewer bot resolves its own
      # threads on seeing the fix, so `isResolved` records ITS satisfaction, never the author's
      # reasoning; and a reply on a thread nobody closed leaves the exchange indistinguishable
      # from one still in progress.
      #
      # The server-side ruleset (`required_conversation_resolution`) enforces only the resolve
      # half, and only at the merge button. This is the half a setting cannot express.
      - name: Every review thread is answered and resolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Only the half this job can re-evaluate — see the ceiling note at the top of the file.
          REVIEW_THREADS_REQUIRE_RESOLVED: "0"
        run: python bin/ci/check_review_threads.py
