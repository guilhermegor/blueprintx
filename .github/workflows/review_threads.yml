name: Review Threads

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

concurrency:
  group: review-gate-${{ (github.event.pull_request.head.repo.fork && startsWith(github.event_name, 'pull_request_review') && github.run_id) || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:

  review-gate-runner:
    name: Review gate runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Gate files unchanged, or the owner approved the change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          str_files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          str_hit=$(printf '%s\n' "$str_files" | grep -Fx \
            -e .github/workflows/review_threads.yml \
            -e templates/common/bin/check_review_threads.py \
            -e templates/python-common/.github/workflows/review-threads.yml \
            -e templates/ts-common/.github/workflows/review-threads.yml \
            -e .review-bots.yaml \
            -e templates/python-common/.review-bots.yaml \
            -e templates/ts-common/.github/.review-bots.yaml || true)
          [ -n "$str_hit" ] || exit 0
          str_labels=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')
          if printf '%s\n' "$str_labels" | grep -Fxq gate-change-approved; then
            echo "::notice::review-thread gate files changed, approved by the gate-change-approved label"
            exit 0
          fi
          echo "::error::PR edits review-thread gate files; the owner must add the gate-change-approved label:"
          printf '%s\n' "$str_hit"
          exit 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Read the PR head before the gate evaluates it
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          str_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          [ -n "$str_head" ] || { echo "::error::could not resolve head SHA for PR ${PR_NUMBER}"; exit 1; }
          echo "sha=$str_head" >>"$GITHUB_OUTPUT"

      - name: Every review thread is answered and resolved
        id: gate
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_THREADS_REQUIRE_RESOLVED: "1"
          EVALUATED_HEAD: ${{ steps.head.outputs.sha }}
          CHECKED_HEAD_FILE: ${{ runner.temp }}/checked_head
        run: python3 templates/common/bin/check_review_threads.py

      - name: Post the required result as a check-run on the PR head
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          EVALUATED_HEAD: ${{ steps.head.outputs.sha }}
          CHECKED_HEAD_FILE: ${{ runner.temp }}/checked_head
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          str_conclusion=failure
          str_title="Unanswered or unresolved review threads"
          if [ "$GATE_OUTCOME" = "success" ]; then
            str_conclusion=success
            str_title="Every review thread is answered and resolved"
          fi
          if [ "$str_conclusion" = success ] && [ "$(cat "$CHECKED_HEAD_FILE" 2>/dev/null)" != "$EVALUATED_HEAD" ]; then
            str_conclusion=failure
            str_title="Gate evaluated a different head than the one read at start"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -X POST \
            -f name="Review threads answered" \
            -f head_sha="$EVALUATED_HEAD" \
            -f status=completed \
            -f conclusion="$str_conclusion" \
            -f details_url="$RUN_URL" \
            -f "output[title]=$str_title" \
            -f "output[summary]=Gate outcome: ${GATE_OUTCOME:-did not run}. Run: $RUN_URL"

      - name: Fail this job when the gate did not pass
        if: steps.gate.outcome != 'success'
        run: exit 1
