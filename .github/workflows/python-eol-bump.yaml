name: Python EOL bump

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive floor and matrix from endoflife.date
        run: python bin/python_eol_bump.py
      - name: Open a pull request when anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Python floor and matrix already current"
            exit 0
          fi
          str_floor="$(tr -d '\n' < templates/python-common/.python-version)"
          str_branch="chore/0-python-floor-${str_floor}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$str_branch"
          git commit -am "chore(templates)!: sync the Python floor to ${str_floor}"
          git push --force origin "$str_branch"
          gh pr create --base main --head "$str_branch" \
            --title "chore(templates)!: sync the Python floor to ${str_floor}" \
            --body "Automated monthly sync from endoflife.date. Floor ${str_floor}."
