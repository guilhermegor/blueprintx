name: Scaffold Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: scaffold_checks-${{ github.ref }}
  cancel-in-progress: true

jobs:


  lint-shell:
    name: ShellCheck — bin/**/*.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck; }

      - name: Lint all shell scripts (severity ≥ warning)
        run: bash bin/ci/check_shell.sh

  git-remote-guard:
    name: Scaffold origin verification — mismatched remote must fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No setup step: the check sources the scaffold lib and drives it against throwaway
      # local repos. It never reaches the network, and `gh` is never invoked.
      - name: Verify an existing origin pointing elsewhere is refused
        run: bash bin/ci/check_git_remote_guard.sh

  function-length:
    name: Function length — 60 lines, docstring excluded
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No dependency and no setup-python step: the gate is stdlib-only ast/re, which is
      # the whole reason it is a hand-rolled script rather than another linter to install.
      - name: Check function length across bin/ and templates/
        run: python3 templates/python-common/bin/check_function_length.py --root .

  test-copy-lists:
    name: Shared test copy lists — scaffolds vs python-common
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A shared test that no scaffold copies is written, committed, and never runs in any
      # generated project — and the only tell is the test COUNT, which nobody reads. Its
      # first run found test_startup_fragility_order.py, the guard on the very fix #160
      # shipped, absent from all five tiers.
      - name: Every shared test is reachable from every scaffold
        run: python3 bin/ci/check_test_copy_lists.py

  lint-actions:
    name: actionlint — workflows (repo + templates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ⚠️ Pinning the version pins what is ASKED FOR, never what ARRIVES — and what arrives
      # is unpacked and EXECUTED on this runner. Hence the SHA-256 check before extracting.
      - name: Install actionlint (pinned + checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint

      # yamllint says "is this valid YAML?"; actionlint says "will GitHub run this?" — and a
      # workflow GitHub refuses produces no red check at all, only a PR that looks like it is
      # waiting. The templates are in scope because their workflows never execute here, so
      # every defect in them was previously found by whoever scaffolded a project.
      - name: Lint workflows
        env:
          LINT_ACTIONS_REQUIRED: "1"
        run: bash bin/ci/check_actions.sh

  validate-meta:
    name: Validate skeleton.meta integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required fields and scaffold paths
        run: bash bin/ci/validate_meta.sh

  version-sync:
    name: Version sync — pyproject vs CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert pyproject.toml and blueprintx.sh versions match
        run: bash bin/ci/check_version_sync.sh

  docs-build:
    name: MkDocs build — strict mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-mkdocs-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-mkdocs-

      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5.0"

      - name: Build documentation (--strict catches broken refs)
        run: bash bin/ci/check_docs_build.sh

  dry-run-smoke:
    name: Dry-run smoke — ${{ matrix.skeleton }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        skeleton:
          - ddd-service-native-db
          - ddd-service-orm-db
          - mvc-service-native-db
          - mvc-service-orm-db
          - lib-minimal
          - react-spa-webpack
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run blueprintx new --dry-run for ${{ matrix.skeleton }}
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
        run: bash bin/ci/smoke_test.sh "$SKELETON"

  scaffold-lint-test:
    name: Scaffold + lint + test — ${{ matrix.skeleton }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Python skeletons only — a real scaffold is generated, its deps are
        # installed, then `make lint` (must change nothing) + `make unit_tests`
        # run. Complements dry-run-smoke, which writes no files.
        skeleton:
          - ddd-service-native-db
          - ddd-service-orm-db
          - mvc-service-native-db
          - mvc-service-orm-db
          - lib-minimal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-poetry-${{ hashFiles('templates/*/pyproject.toml') }}
          restore-keys: pip-poetry-

      - name: Install scaffold tooling (envsubst)
        # The scaffold renders templates with envsubst (gettext). GitHub runners
        # ship it preinstalled, so the guard makes this a no-op there and the
        # install runs only where it is genuinely missing (e.g. under act).
        # Unguarded, the apt-get round-trip hung two jobs for 6h (#192).
        run: command -v envsubst >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base; }

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Real scaffold, then make lint + make unit_tests
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
        run: bash bin/ci/scaffold_lint_test.sh "$SKELETON"

  scaffold-lint-test-multi:
    name: Scaffold + lint + test (multi-intent) — ${{ matrix.skeleton }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The multi-intent pipeline opt-in is MVC-only. MULTI_PIPELINE_OPTIN=true forces the
        # scaffold's pipeline-intent prompt to "yes" non-interactively (inherited by the scaffold
        # subprocess), so the generated dispatch trio is linted + tested like any other scaffold.
        skeleton:
          - mvc-service-native-db
          - mvc-service-orm-db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-poetry-${{ hashFiles('templates/*/pyproject.toml') }}
          restore-keys: pip-poetry-

      - name: Install scaffold tooling (envsubst)
        run: command -v envsubst >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base; }

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Real multi-intent scaffold, then make lint + make unit_tests
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
          MULTI_PIPELINE_OPTIN: "true"
        run: bash bin/ci/scaffold_lint_test.sh "$SKELETON"

  typecheck-ts:
    name: TypeScript typecheck — react-spa-webpack template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: templates/ts-common/package.json

      - name: Assemble typecheck workspace
        run: |
          mkdir -p /tmp/ts-typecheck/src
          export PROJECT_NAME="ci-typecheck"
          export PROJECT_DESCRIPTION="CI typecheck workspace"
          envsubst '${PROJECT_NAME} ${PROJECT_DESCRIPTION}' \
            < templates/ts-common/package.json \
            > /tmp/ts-typecheck/package.json
          cp templates/react-spa-webpack/tsconfig.json /tmp/ts-typecheck/tsconfig.json
          cp -r templates/react-spa-webpack/src/. /tmp/ts-typecheck/src/

      - name: Install npm dependencies
        working-directory: /tmp/ts-typecheck
        run: npm install

      - name: Run tsc --noEmit (type errors only, no output files)
        working-directory: /tmp/ts-typecheck
        run: npx tsc --noEmit

  spell-check:
    name: Spell check — docs/ and templates/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codespell
        run: pip install codespell

      - name: Run codespell (skips binaries and lockfiles)
        run: bash bin/ci/check_spelling.sh

      # The locale vocabulary this repo learns must reach the copy that ships into every
      # scaffolded project — the two lists drifted in both directions before, and the stale
      # side was the template, so only generated projects paid for it.
      - name: Codespell ignore-list sync (root vs template)
        run: bash bin/ci/check_codespell_sync.sh
