name: Scaffold Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: scaffold_checks-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint-shell:
    name: ShellCheck — bin/**/*.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck; }

      - name: Lint all shell scripts (severity ≥ warning)
        run: bash bin/ci/check_shell.sh

  sed-portability:
    name: sed portability — no bare sed -i (blueprintx#459)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject a bare sed -i under bin/ and templates/**/bin/
        run: bash bin/ci/check_sed_portability.sh

  git-remote-guard:
    name: Scaffold origin verification — mismatched remote must fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify an existing origin pointing elsewhere is refused
        run: bash bin/ci/check_git_remote_guard.sh

  review-bot-roster-optout:
    name: Review-bot roster opt-out — "no" must omit .review-bots.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify INCLUDE_REVIEW_BOT_ROSTER=false omits the roster on all three scaffold shapes
        run: bash bin/ci/check_review_bot_roster_optout.sh

  docs-gap:
    name: Docs gap — published pages registered in nav and index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pathspec and pyyaml
        run: python3 -m pip install pathspec pyyaml

      - name: Check every published docs page reaches mkdocs nav and the docs/CLAUDE.md index
        run: python3 templates/python-common/bin/check_docs_gap.py --root .

  function-length:
    name: Function length — 60 lines, docstring excluded
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check function length across bin/ and templates/
        run: python3 templates/python-common/bin/check_function_length.py --root .

  comment-budget:
    name: Comment budget — long runs + decorative banners (blueprintx#303)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the comment budget across bin/ and templates/
        run: python3 templates/python-common/bin/check_comment_budget.py --root . --require-baseline

      - name: The baseline must not exceed the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if [ -n "$(git ls-tree --name-only FETCH_HEAD -- comment_budget_baseline.txt)" ]; then
            git show FETCH_HEAD:comment_budget_baseline.txt > "$RUNNER_TEMP/base_baseline.txt"
            python3 templates/python-common/bin/check_comment_budget.py --root . --require-baseline --compare-baseline "$RUNNER_TEMP/base_baseline.txt"
          else
            echo "base branch has no baseline yet; nothing to compare"
          fi

  env-docs-sync:
    name: .env.example matches docs/configuration.md (blueprintx#304)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every tier's .env.example against its configuration table
        run: python3 templates/python-common/bin/check_env_docs_sync.py --each-under templates

  complexity:
    name: Cyclomatic complexity — tests 1, src 2, bin 8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ruff
        run: pipx install ruff

      - name: Check cyclomatic complexity across bin/ and templates/
        run: bash templates/python-common/bin/check_complexity.sh --root .

  complexity-templates:
    name: Cyclomatic complexity — templates/python-common (tests 1, src 2, bin 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ruff
        run: pipx install ruff

      - name: Check cyclomatic complexity across templates/python-common
        run: bash templates/python-common/bin/check_complexity.sh --root templates/python-common

  gate-integrity:
    name: Gate integrity — a PR must not weaken a check without saying why
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for an unjustified gate weakening since main
        run: python3 templates/python-common/bin/check_gate_integrity.py --root .

  required-checks-sync:
    name: Required checks sync — expected contexts vs PR jobs (blueprintx#535)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3

      - name: Should-fail regression tests for the sync gate
        run: bash tests/test_check_required_checks_sync.sh

      - name: Required contexts must match the jobs that run on every PR
        env:
          REQUIRED_CHECKS_SYNC_REQUIRED: "1"
        run: python3 bin/ci/check_required_checks_sync.py

  pr-file-count:
    name: PR file-count ceiling — 90 files (blueprintx#551)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the branch's cumulative diff against the file-count ceiling
        run: python3 bin/ci/check_pr_file_count.py

  docs-code-refs:
    name: Docs code references — symbols + import paths (blueprintx#159)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check docs-cited symbols and import paths across docs/
        run: python3 templates/python-common/bin/check_docs_code_refs.py --root .

  quality-rules:
    name: quality-rules.yaml validation (blueprintx#432)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the quality-rules registry against the templates it describes
        run: python3 templates/python-common/bin/check_quality_rules.py --root .

  test-copy-lists:
    name: Shared test copy lists — scaffolds vs python-common
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Every shared test is reachable from every scaffold
        run: python3 bin/ci/check_test_copy_lists.py

  lint-actions:
    name: actionlint — workflows (repo + templates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned + checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint

      - name: Lint workflows
        env:
          LINT_ACTIONS_REQUIRED: "1"
        run: bash bin/ci/check_actions.sh

      - name: Should-fail regression tests for check_action_pins
        run: bash tests/test_check_actions_pins.sh

  secret-scan:
    name: GitGuardian — secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Report and skip — bot-authored PR, no Dependabot secret store entry
        if: >-
          github.event_name == 'pull_request' &&
          endsWith(github.event.pull_request.user.login, '[bot]')
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "::warning::GitGuardian secret scan did NOT run for this PR (author: $PR_AUTHOR)."
          echo "GitHub does not expose this repo's Actions secrets to a Dependabot-triggered run"
          echo "-- only secrets in the separate Dependabot secret store, which this repo has"
          echo "none of (blueprintx#457). This is NOT 'scanned, found nothing': gitleaks"
          echo "(secret_scan.yml) already scans this same range unconditionally, no key needed."
          echo "To close this gap too:"
          echo "  gh secret set GITGUARDIAN_API_KEY --app dependabot --repo <owner>/<repo>"

      - name: Install ggshield
        if: >-
          !(github.event_name == 'pull_request' &&
            endsWith(github.event.pull_request.user.login, '[bot]'))
        run: pipx install ggshield

      - name: Scan the push/PR range for secrets
        if: >-
          (github.event_name == 'pull_request' &&
           !endsWith(github.event.pull_request.user.login, '[bot]')) ||
          (github.event_name == 'push' &&
           github.event.before != '0000000000000000000000000000000000000000')
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.before }}
        run: ggshield secret scan ci

      - name: Scan the whole repository for secrets
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'push' ||
           github.event.before == '0000000000000000000000000000000000000000')
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: ggshield secret scan repo .

  project-name-identities:
    name: Dist name vs import package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install envsubst
        run: command -v envsubst >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y gettext-base)

      - name: Render the lib-minimal templates with a hyphenated name and compile them
        run: bash bin/ci/check_project_name_identities.sh

  validate-meta:
    name: Validate skeleton.meta integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required fields and scaffold paths
        run: bash bin/ci/validate_meta.sh

      - name: Should-fail regression tests for validate_meta.sh
        run: bash tests/test_validate_meta.sh

      - name: Should-fail regression tests for the docs-locale prompt
        run: bash tests/test_docs_locale_prompt.sh

      - name: Should-fail regression tests for the prompt tty guard
        run: bash tests/test_prompt_tty_guard.sh

      - name: Should-fail regression tests for the scaffold_lint_test.sh cleanup trap
        run: bash tests/test_scaffold_lint_test_cleanup.sh

      - name: Should-fail regression tests for close_linked_issues.sh
        run: bash tests/test_close_linked_issues.sh

      - name: Should-fail regression tests for dependabot_auto_merge.sh
        run: bash tests/test_dependabot_auto_merge.sh

      - name: Should-fail regression tests for check_pr_policy.sh
        run: bash tests/test_check_pr_policy.sh

  promote-offline-to-online:
    name: promote_offline_to_online.sh refusal-path tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refusal-path tests (blueprintx#382)
        run: bash tests/test_promote_offline_to_online.sh

  spec-answers:
    name: --spec regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the --spec should-fail suite (blueprintx#629)
        run: bash tests/test_spec_answers.sh

  scaffold-kanban:
    name: scaffold kanban board and labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the kanban should-fail suite (blueprintx#592)
        run: bash tests/test_scaffold_kanban.sh

      - name: Run the scaffold git-remote should-fail suite (blueprintx#732)
        run: bash tests/test_scaffold_git_remote.sh

      - name: Run the scaffold provenance and copy-list suite (blueprintx#635)
        run: bash tests/test_scaffold_python_templates.sh

  specs-structure:
    name: .specs/ structure guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check .specs/ layout (blueprintx#447)
        run: bash bin/ci/check_specs_structure.sh --root .

      - name: Run the .specs/ structure should-fail suite (blueprintx#583)
        run: bash tests/test_check_specs_structure.sh

  docs-boundary:
    name: docs/ boundary guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check docs/ holds only published documentation (blueprintx#536)
        run: bash bin/ci/check_docs_boundary.sh

      - name: Should-fail regression tests for the boundary gate
        run: bash tests/test_check_docs_boundary.sh

  review-config-shipped:
    name: Every skeleton ships the hosted-reviewer config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scaffold every skeleton and assert the review config is in the tree (blueprintx#740)
        run: bash bin/ci/check_review_config_shipped.sh --generated

      - name: Should-fail regression tests for the review-config guard
        run: bash tests/test_check_review_config_shipped.sh

  lockfile-sync:
    name: Lockfile sync — templates/*/package.json vs package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert every template lockfile carries its package.json dependencies (#588)
        run: bash bin/ci/check_lockfile_sync.sh

      - name: Should-fail regression tests for the lockfile gate
        run: bash tests/test_check_lockfile_sync.sh

  version-sync:
    name: Version sync — pyproject vs CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert pyproject.toml and blueprintx.sh versions match
        run: bash bin/ci/check_version_sync.sh

  docs-build:
    name: MkDocs build — strict mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-mkdocs-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-mkdocs-

      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5.0"

      - name: Build documentation (--strict catches broken refs)
        run: bash bin/ci/check_docs_build.sh

  dry-run-smoke:
    name: Dry-run smoke — ${{ matrix.skeleton }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        skeleton:
          - ddd-service-native-db
          - ddd-service-orm-db
          - mvc-service-native-db
          - mvc-service-orm-db
          - lib-minimal
          - react-spa-webpack
          - bash-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run blueprintx new --dry-run for ${{ matrix.skeleton }}
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
        run: bash bin/ci/smoke_test.sh "$SKELETON"

  scaffold-lint-test:
    name: Scaffold + lint + test — ${{ matrix.skeleton }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        skeleton:
          - ddd-service-native-db
          - ddd-service-orm-db
          - mvc-service-native-db
          - mvc-service-orm-db
          - lib-minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-poetry-${{ hashFiles('templates/*/pyproject.toml') }}
          restore-keys: pip-poetry-

      - name: Install scaffold tooling (envsubst)
        run: command -v envsubst >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base; }

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Real scaffold, then make lint + make unit_tests
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
        run: bash bin/ci/scaffold_lint_test.sh "$SKELETON"

  scaffold-lint-test-multi:
    name: Scaffold + lint + test (multi-intent) — ${{ matrix.skeleton }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        skeleton:
          - mvc-service-native-db
          - mvc-service-orm-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-poetry-${{ hashFiles('templates/*/pyproject.toml') }}
          restore-keys: pip-poetry-

      - name: Install scaffold tooling (envsubst)
        run: command -v envsubst >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base; }

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Real multi-intent scaffold, then make lint + make unit_tests
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
          MULTI_PIPELINE_OPTIN: "true"
        run: bash bin/ci/scaffold_lint_test.sh "$SKELETON"

  scaffold-lint-test-storage:
    name: Scaffold + lint + test (storage opt-in) — ${{ matrix.skeleton }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        skeleton:
          - ddd-service-native-db
          - ddd-service-orm-db
          - api-service-native-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-poetry-${{ hashFiles('templates/*/pyproject.toml') }}
          restore-keys: pip-poetry-

      - name: Install scaffold tooling (envsubst)
        run: command -v envsubst >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base; }

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Real scaffold with the storage opt-in, then lint + tests
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
          SCAFFOLD_SPEC_FILE: bin/ci/optin_specs/storage.answers
        run: bash bin/ci/scaffold_lint_test.sh "$SKELETON"

  scaffold-lint-test-otel:
    name: Scaffold + lint + test (otel opt-in) — ${{ matrix.skeleton }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        skeleton:
          - ddd-service-orm-db
          - api-service-native-db
          - mvc-service-orm-db
          - lib-minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-poetry-${{ hashFiles('templates/*/pyproject.toml') }}
          restore-keys: pip-poetry-

      - name: Install scaffold tooling (envsubst)
        run: command -v envsubst >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base; }

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Real scaffold with the otel opt-in, then lint + tests
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
          SCAFFOLD_SPEC_FILE: bin/ci/optin_specs/otel.answers
        run: bash bin/ci/scaffold_lint_test.sh "$SKELETON"

  typecheck-ts:
    name: TypeScript build + lint — ${{ matrix.skeleton }} template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        skeleton:
          - react-spa-webpack
          - ts-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Real scaffold (offline, no opt-ins)
        env:
          GITHUB_USERNAME: ci-bot
          SKELETON: ${{ matrix.skeleton }}
        run: |
          git config --global user.email "ci-bot@example.com"
          git config --global user.name "ci-bot"
          scaffold="$(grep '^scaffold=' "templates/$SKELETON/skeleton.meta" | cut -d= -f2-)"
          bash "$scaffold" "$RUNNER_TEMP" ci-scaffold "CI scaffold" </dev/null

      - name: Install npm dependencies (npm ci enforces the committed lockfile,
        working-directory: ${{ runner.temp }}/ci-scaffold
        run: npm ci

      - name: Type-check (tsc --noEmit)
        working-directory: ${{ runner.temp }}/ci-scaffold
        run: npm run type-check

      - name: Build
        working-directory: ${{ runner.temp }}/ci-scaffold
        run: npm run build

      - name: Lint CSS (stylelint)
        working-directory: ${{ runner.temp }}/ci-scaffold
        run: npm run lint:css

      - name: Lint (eslint)
        working-directory: ${{ runner.temp }}/ci-scaffold
        run: npm run lint

  spell-check:
    name: Spell check — docs/ and templates/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install codespell
        run: pip install codespell

      - name: Run codespell (skips binaries and lockfiles)
        run: bash bin/ci/check_spelling.sh

      - name: Codespell ignore-list sync (root vs template)
        run: bash bin/ci/check_codespell_sync.sh

      - name: CLAUDE.md bridge gate (blueprintx#754)
        run: bash bin/ci/check_agents_md_bridge.sh && bash tests/test_check_agents_md_bridge.sh

  makefile-pairing:
    name: Makefile <-> tasks.sh <-> bin/help.sh pairing (blueprintx#241)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every Makefile target has a tasks.sh case branch and a help.sh entry
        run: bash bin/check_makefile_pairing.sh

  precommit-ci-parity:
    name: Pre-commit and CI run the same checks, both directions (blueprintx#384)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every script wired into one side is wired into the other, or exempted with a reason
        run: bash bin/check_precommit_ci_parity.sh

  markdown-lint:
    name: markdownlint — measured rule set (blueprintx#383)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pymarkdownlnt
        run: pip install pymarkdownlnt==0.9.40

      - name: Lint every tracked .md file (root + templates/) with the measured rule set
        env:
          MARKDOWNLINT_REQUIRED: "1"
        run: bash bin/ci/check_markdown.sh
