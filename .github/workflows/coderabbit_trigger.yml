name: CodeRabbit Trigger

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: coderabbit-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  trigger:
    name: Ask CodeRabbit for a review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The trigger PAT must exist and be well-formed
        env:
          GH_PAT_REVIEW_TRIGGER: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
        run: |
          if [ -z "$GH_PAT_REVIEW_TRIGGER" ]; then
            echo "::error::GH_PAT_REVIEW_TRIGGER is not set, so no review can be requested." >&2
            echo "GITHUB_TOKEN cannot substitute: CodeRabbit ignores bot-authored comments" >&2
            echo "(measured on PR #210). Set a user PAT with Pull requests: write —" >&2
            echo "  gh secret set GH_PAT_REVIEW_TRIGGER --repo $GITHUB_REPOSITORY --body '<pat>'" >&2
            exit 1
          fi

          case "$GH_PAT_REVIEW_TRIGGER" in
          github_pat_*) echo "token class: fine-grained (github_pat_)" ;;
          ghp_*) echo "token class: classic PAT (ghp_)" ;;
          gho_*) echo "token class: OAuth (gho_) — this is a gh-CLI login token, not a PAT" ;;
          ghs_*) echo "token class: installation/app (ghs_) — cannot act as a user" ;;
          *) echo "::warning::token class: UNRECOGNISED prefix — is this a token at all?" ;;
          esac

          if printf '%s' "$GH_PAT_REVIEW_TRIGGER" | grep -qE '[[:space:]]'; then
            echo "::error::the stored secret contains whitespace (very likely a trailing newline)." >&2
            echo "That 401s exactly like a bad token. Re-store it with --body, never a redirect:" >&2
            echo "  gh secret set GH_PAT_REVIEW_TRIGGER --repo $GITHUB_REPOSITORY --body '<pat>'" >&2
            exit 1
          fi
          echo "no whitespace in the stored value."

      - name: The PAT must authenticate as a user
        id: pat_check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
        run: |
          set +e
          RESPONSE="$(gh api -i --jq '"authenticates as \(.login) [\(.type)]"' user 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "$RESPONSE" | tail -n1
            exit 0
          fi

          echo "$RESPONSE" >&2
          str_http_status="$(printf '%s\n' "$RESPONSE" | head -n1 | grep -oE '[0-9]{3}' | head -n1)"

          if printf '%s\n' "$RESPONSE" | grep -qi 'rate limit'; then
            str_retry_after="$(printf '%s\n' "$RESPONSE" \
              | grep -i '^retry-after:' | tr -d '\r ' | cut -d: -f2)"
            str_reset_epoch="$(printf '%s\n' "$RESPONSE" \
              | grep -i '^x-ratelimit-reset:' | tr -d '\r ' | cut -d: -f2)"

            if [ -n "$str_retry_after" ]; then
              int_wait_min=$(( (str_retry_after + 59) / 60 ))
              echo "::warning::GitHub SECONDARY rate limit (HTTP ${str_http_status:-403/429})" \
                "hit for the PAT's user — not a bad token, and not CodeRabbit's review quota." \
                "Retry after ${str_retry_after}s (~${int_wait_min}m). Skipping the review" \
                "request this run. A later push will NOT retry — this workflow no longer" \
                "listens for \`synchronize\` (#454). Recovery is review_retry.yml: its" \
                "schedule, or \`gh workflow run review_retry.yml\` to ask immediately." >&2
            elif [ -n "$str_reset_epoch" ]; then
              str_reset_utc="$(date -u -d "@$str_reset_epoch" '+%Y-%m-%d %H:%M:%S UTC')"
              int_wait_min=$(( (str_reset_epoch - $(date -u +%s) + 59) / 60 ))
              echo "::warning::GitHub API rate limit (HTTP ${str_http_status:-403}) hit for the" \
                "PAT's user — not a bad token. This is the GitHub API's own limit, not" \
                "CodeRabbit's review quota. Quota resets at $str_reset_utc (~${int_wait_min}m)." \
                "Skipping the review request this run. A later push will NOT retry — this" \
                "workflow no longer listens for \`synchronize\` (#454). Recovery is" \
                "review_retry.yml: its schedule, or \`gh workflow run review_retry.yml\`." >&2
            else
              echo "::warning::GitHub rate limit (HTTP ${str_http_status:-unknown}) hit for the" \
                "PAT's user, but neither retry-after nor x-ratelimit-reset was present to say" \
                "when it clears." >&2
            fi
            echo "skip_review=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::PAT auth failed with HTTP ${str_http_status:-unknown}, and the response" \
            "carries no rate-limit wording. If the value was well-formed (previous step), the" \
            "token itself is expired, revoked, or scoped to the wrong resource owner — none of" \
            "which this repo can fix." >&2
          exit 1

      - name: Request the review
        if: steps.pat_check.outputs.skip_review != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body='@coderabbitai review' \
            --jq '"requested by \(.user.login) [\(.user.type)]"'
