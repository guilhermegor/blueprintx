name: Verify Required Checks

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify_required_checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks-drift:
    name: required checks drift guard (blueprintx#535)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3

      - name: Live protection and rulesets must match .github/required-checks.json
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS_SYNC_REQUIRED: "1"
        run: python3 bin/ci/check_required_checks_sync.py --live
