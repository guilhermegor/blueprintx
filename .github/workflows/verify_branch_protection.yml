name: Verify Branch Protection

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify_branch_protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-required-checks:
    name: strict required-checks guard (blueprintx#307)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The verification PAT must exist
        env:
          GH_PAT_REVIEW_TRIGGER: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
        run: |
          if [ -z "$GH_PAT_REVIEW_TRIGGER" ]; then
            echo "::error::GH_PAT_REVIEW_TRIGGER is not set, so branch-protection strictness cannot be verified." >&2
            echo "GITHUB_TOKEN cannot substitute: reading branch protection needs Administration" >&2
            echo "access, which the default Actions token can never be granted." >&2
            exit 1
          fi

      - name: Assert required_status_checks.strict is enforced
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
        run: bash templates/python-common/bin/enable_repo_rules.sh verify
