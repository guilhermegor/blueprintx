name: Verify Branch Protection

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify_branch_protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-required-checks:
    name: no-strict required-checks guard (blueprintx#1285)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The verification PAT must exist
        env:
          GH_PAT_REVIEW_TRIGGER: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
        run: |
          if [ -z "$GH_PAT_REVIEW_TRIGGER" ]; then
            echo "::error::GH_PAT_REVIEW_TRIGGER is not set, so branch-protection policy cannot be verified." >&2
            echo "GITHUB_TOKEN cannot substitute: reading branch protection needs Administration" >&2
            echo "access, which the default Actions token can never be granted." >&2
            exit 1
          fi

      - name: Assert strict is OFF and the required checks are present
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REVIEW_TRIGGER }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch=main
          default_branch="$(gh api "repos/$repo" --jq .default_branch)"
          [ "$default_branch" = "$branch" ] \
            || { echo "::error::default branch is '$default_branch', expected '$branch'" >&2; exit 1; }
          rules="$(gh api "repos/$repo/rules/branches/$branch?per_page=100" --paginate | jq -s 'add // []')"
          jq -e '[.[] | select(.type == "required_status_checks")] | length > 0' <<<"$rules" >/dev/null \
            || { echo "::error::no required_status_checks rule applies to $branch" >&2; exit 1; }
          jq -e 'all(.[] | select(.type == "required_status_checks"); (.parameters.required_status_checks | length) > 0)' <<<"$rules" >/dev/null \
            || { echo "::error::a required_status_checks rule on $branch lists no checks" >&2; exit 1; }
          jq -e 'all(.[] | select(.type == "required_status_checks"); (.parameters.strict_required_status_checks_policy // false) == false)' <<<"$rules" >/dev/null \
            || { echo "::error::strict_required_status_checks_policy is not false on $branch (blueprintx#1285)" >&2; exit 1; }
          err="$(mktemp)"
          if classic="$(gh api "repos/$repo/branches/$branch/protection" 2>"$err")"; then
            jq -e '.required_status_checks.strict != true' <<<"$classic" >/dev/null \
              || { echo "::error::classic required_status_checks.strict is true on $branch (blueprintx#1285)" >&2; exit 1; }
          elif ! grep -q "Branch not protected" "$err" && [[ "$classic" != *"Branch not protected"* ]]; then
            echo "::error::could not read classic branch protection: $(cat "$err") $classic" >&2
            exit 1
          fi
          echo "strict is off and required checks are present on $branch"
