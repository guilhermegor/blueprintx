name: Gate Integrity

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gate_integrity-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  gate-integrity:
    name: Gate integrity — a PR must not weaken a check without saying why
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install PyYAML for the workflow parser
        run: python3 -m pip install pyyaml==6.0.3

      - name: Check for an unjustified gate weakening since main
        run: python3 templates/python-common/bin/check_gate_integrity.py --root .
        env:
          GATE_APPROVAL_COMMENT: ${{ runner.temp }}/gate_approvals.md

      - name: Show every accepted approval on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GATE_APPROVAL_COMMENT: ${{ runner.temp }}/gate_approvals.md
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -s "$GATE_APPROVAL_COMMENT" ] || exit 0
          str_id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- gate-integrity-approvals -->"))) | .id' | head -n 1)
          if [ -n "$str_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$str_id" -F body=@"$GATE_APPROVAL_COMMENT"
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -F body=@"$GATE_APPROVAL_COMMENT"
          fi
