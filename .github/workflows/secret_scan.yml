name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret_scan-${{ github.ref }}
  cancel-in-progress: true

jobs:

  gitleaks:
    name: gitleaks — repo history (root + templates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: gitleaks scans PAST commits too, not just the working tree.
          fetch-depth: 0

      # ⚠️ Pinning the version pins what is ASKED FOR, never what ARRIVES — and what arrives is
      # unpacked and EXECUTED on this runner. Hence the SHA-256 check before extracting, the
      # same pattern lint-actions uses for actionlint.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      # A graceful skip is right on a contributor's box and placebo in CI — GITLEAKS_REQUIRED=1
      # turns a missing/broken install into a hard failure instead of a silent green.
      - name: Scan this repo's history for secrets
        env:
          GITLEAKS_REQUIRED: "1"
        run: bash templates/python-common/bin/check_secrets.sh --root .
