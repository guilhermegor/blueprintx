name: Issue Scope

# Full design + declaration format + UNKNOWN/undeclared/no-linked-issue behaviour: docs/issue-scope.md
# and bin/ci/check_issue_scope.py's module docstring. Kept as its OWN workflow (not folded into
# scaffold_checks.yml) so an edit to a PR's linked issues re-runs this one job, not the 29-job
# scaffold matrix — same reasoning as review_threads.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # An ISSUE edit changes the declaration this gate judges against, and no pull_request event
  # fires for it — the PR's green would then describe an older surface (blueprintx#314 review).
  issues:
    types: [edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  issue-scope:
    name: PR files within declared issue scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ The BASE commit, never the PR's merge ref. actions/checkout defaults to the merge
      # commit on a pull_request event, so the default would run the very gate script the PR is
      # allowed to edit — a PR could rewrite check_issue_scope.py to exit 0 and judge itself.
      # Reading the base means the rule applied is the one already on the default branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Changed files must stay inside the linked issue's declared surface
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 bin/ci/check_issue_scope.py

  reevaluate-after-issue-edit:
    name: Re-evaluate open PRs after a linked issue edit
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The ONLY job that writes: it posts its verdict as a commit status on each affected PR
      # head, because a job triggered by `issues` is attached to no PR's check suite.
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Re-check every open PR that closes the edited issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash bin/ci/reevaluate_issue_scope.sh
