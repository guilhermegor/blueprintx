name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0, or 0.2.0-rc.1)"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The input is free text. A malformed value (a stray `/`, a leading `v`, an
      # injected `;`) would otherwise reach `git tag` — the irreversible half of this
      # job — before any package-manager job has a chance to fail loudly. Reject it
      # here so a bad input is a no-op, not a pushed tag with no matching artifacts.
      - name: Validate version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected SemVer MAJOR.MINOR.PATCH with no leading zeroes, optionally followed by a hyphen and dot-separated non-empty prerelease identifiers (e.g. 1.2.3, 1.2.3-rc.1). Rejected: 1.2.3.rc, 1.2.3-rc., 1.2.3-rc..1, 01.2.3, 1.2.3-rc.01." >&2
            exit 1
          fi

      - name: Create and push tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "release: v${VERSION}"
          git push origin "v${VERSION}"

  homebrew:
    needs: tag
    uses: ./.github/workflows/release_homebrew.yml
    permissions:
      contents: write
    with:
      version: ${{ github.event.inputs.version }}

  chocolatey:
    needs: tag
    uses: ./.github/workflows/release_chocolatey.yml
    permissions:
      contents: write
    with:
      version: ${{ github.event.inputs.version }}

  apt:
    needs: tag
    uses: ./.github/workflows/release_apt.yml
    permissions:
      contents: write
    with:
      version: ${{ github.event.inputs.version }}
    secrets:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}

  snap:
    needs: tag
    uses: ./.github/workflows/release_snap.yml
    permissions:
      contents: write
    with:
      version: ${{ github.event.inputs.version }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
