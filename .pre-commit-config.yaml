# Root pre-commit for the BlueprintX repo itself — a local mirror of the
# Scaffold Checks CI (.github/workflows/scaffold_checks.yml) so the same
# failures surface before commit/push.
#
# This is NOT the scaffolded-project pre-commit. That one lives at
# templates/python-common/.pre-commit-config.yaml and ships into generated
# projects; it is intentionally separate and untouched by this file.
#
# The repo-local hooks delegate to bin/ci/*.sh — the very scripts the CI jobs
# call — so local and CI run identical logic with zero drift.

default_install_hook_types:
  - pre-commit
  - commit-msg

# pre-commit enlists a hook in EVERY installed hook type unless the hook declares a stage.
# Without this line the Layer-3 hooks below — which carry `always_run: true` and no `stages:`
# — run once on commit AND again on commit-msg: two full `mkdocs build --strict` runs, two
# repo-wide codespell scans, per commit. The duplication is invisible in the config, because
# the silence that correctly means "on commit" also means "on every other installed hook".
# Same fix as templates/python-common/.pre-commit-config.yaml (#158); this config was missed.
# Hooks that belong elsewhere still say so explicitly (`commit-msg` below).
default_stages:
  - pre-commit

repos:
  # Layer 1 — generic hygiene (no custom logic).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --unsafe  # workflow files use custom tags (e.g. !reference)
      - id: check-json
        # JSONC files (comments allowed) must skip the strict JSON parser:
        # any .vscode/ dir (incl. templates/**/.vscode/) and TypeScript tsconfig*.
        exclude: (^|/)\.vscode/|(^|/)tsconfig[^/]*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args:
          - --maxkb=500
      - id: no-commit-to-branch  # protects main, matches CONTRIBUTING.md

  # Layer 2 — Conventional Commits enforcement (commit-msg stage).
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages:
          - commit-msg

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages:
          - commit-msg

  # Layer 3 — the shared bin/ci scripts the CI jobs also call. language: system
  # + pass_filenames: false: each script runs its own full scan, matching CI.
  - repo: local
    hooks:
      - id: codespell
        name: codespell (docs/ + templates/)
        entry: bash bin/ci/check_spelling.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: codespell-sync
        name: codespell ignore-list sync (root vs template)
        entry: bash bin/ci/check_codespell_sync.sh
        language: system
        pass_filenames: false
        files: \.codespellrc$

      - id: shellcheck
        name: shellcheck (bin/**/*.sh)
        entry: bash bin/ci/check_shell.sh
        language: system
        pass_filenames: false
        files: ^bin/.*\.sh$

      - id: git-remote-guard
        name: scaffold origin verification (mismatched remote must fail)
        entry: bash bin/ci/check_git_remote_guard.sh
        language: system
        pass_filenames: false
        files: ^bin/(lib/scaffold_git_remote\.sh|ci/check_git_remote_guard\.sh)$

      - id: lint-actions
        name: actionlint (workflows, repo + templates)
        entry: bash bin/ci/check_actions.sh
        language: system
        pass_filenames: false
        files: (^|/)\.github/workflows/.*\.(yml|yaml)$

      - id: function-length
        name: function length (60 lines, docstring excluded)
        # Runs templates/python-common/bin/check_function_length.py over THIS repo via
        # --root, rather than keeping a second copy: bin/ci/check_codespell_sync.sh exists
        # only because two copies of a shared asset drifted apart.
        entry: python3 templates/python-common/bin/check_function_length.py --root .
        language: system
        pass_filenames: false
        files: \.(py|sh)$

      - id: check-complexity
        name: cyclomatic complexity (tests 1, src 2, bin 8)
        # Same treatment as function-length above: ONE implementation, run over this repo via
        # --root rather than kept as a second copy. ⚠️ BlueprintX's own tree has no src/ or
        # tests/, so today this checks only bin/ (2 files) at the bin ceiling of 8 — the gate
        # earns its keep here by travelling with the template it polices, not by the size of
        # what it currently finds.
        entry: bash templates/python-common/bin/check_complexity.sh --root .
        language: system
        pass_filenames: false
        files: \.py$

      - id: check-secrets
        name: secret scan (gitleaks)
        # Same treatment as check-complexity above: ONE implementation, run over this repo via
        # --root rather than kept as a second copy. gitleaks resolves its own config from
        # <root>/.gitleaks.toml, so no --config flag is needed. Resolves gracefully when
        # gitleaks is absent locally; CI sets GITLEAKS_REQUIRED=1.
        entry: bash templates/python-common/bin/check_secrets.sh --root .
        language: system
        pass_filenames: false
        always_run: true

      - id: test-copy-lists
        name: shared test copy lists (scaffolds vs python-common)
        entry: python3 bin/ci/check_test_copy_lists.py
        language: system
        pass_filenames: false
        files: ^(bin/scaffold/python_.*\.sh|templates/python-common/tests/unit/.*\.py)$

      - id: project-name-identities
        name: dist name vs import package (blueprintx#113)
        entry: bash bin/ci/check_project_name_identities.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/common\.sh|bin/blueprintx\.sh|bin/scaffold/python_.*\.sh|templates/lib-minimal/.*)$

      - id: validate-meta
        name: validate skeleton.meta integrity
        entry: bash bin/ci/validate_meta.sh
        language: system
        pass_filenames: false
        files: skeleton\.meta$

      - id: version-sync
        name: version sync (pyproject vs CLI)
        entry: bash bin/ci/check_version_sync.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: mkdocs-strict
        name: mkdocs build --strict
        entry: bash bin/ci/check_docs_build.sh
        language: system
        pass_filenames: false
        always_run: true
