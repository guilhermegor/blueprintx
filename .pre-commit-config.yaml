
default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --unsafe
      - id: check-json
        exclude: (^|/)\.vscode/|(^|/)tsconfig[^/]*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args:
          - --maxkb=1000
      - id: no-commit-to-branch

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages:
          - commit-msg

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages:
          - commit-msg

  - repo: local
    hooks:
      - id: codespell
        name: codespell (docs/ + templates/)
        entry: bash bin/ci/check_spelling.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: codespell-sync
        name: codespell ignore-list sync (root vs template)
        entry: bash bin/ci/check_codespell_sync.sh
        language: system
        pass_filenames: false
        files: \.codespellrc$

      - id: agents-md-bridge
        name: CLAUDE.md bridge gate (blueprintx#754)
        entry: bash -c 'bash bin/ci/check_agents_md_bridge.sh && bash tests/test_check_agents_md_bridge.sh'
        language: system
        pass_filenames: false
        files: ^(templates/[^/]+/[^/]+\.(md|meta)|templates/common/.*|bin/(scaffold|lib)/.*\.sh|bin/ci/check_agents_md_bridge\.sh|tests/test_check_agents_md_bridge\.sh)$

      - id: shellcheck
        name: shellcheck (bin/**/*.sh)
        entry: bash bin/ci/check_shell.sh
        language: system
        pass_filenames: false
        files: ^bin/.*\.sh$

      - id: sed-portability
        name: sed portability (no bare sed -i, blueprintx#459)
        entry: bash bin/ci/check_sed_portability.sh
        language: system
        pass_filenames: false
        files: ^(bin/.*\.sh|templates/.*/bin/.*\.sh)$

      - id: git-remote-guard
        name: scaffold origin verification (mismatched remote must fail)
        entry: bash bin/ci/check_git_remote_guard.sh
        language: system
        pass_filenames: false
        files: ^bin/(lib/scaffold_git_remote\.sh|ci/check_git_remote_guard\.sh)$

      - id: review-bot-roster-optout
        name: review-bot roster opt-out ("no" must omit .review-bots.yaml)
        entry: bash bin/ci/check_review_bot_roster_optout.sh
        language: system
        pass_filenames: false
        files: ^(bin/(lib/scaffold_(git_remote|python_templates)\.sh|scaffold/(ts_lib|ts_react_app|python_lib_minimal)\.sh|ci/check_review_bot_roster_optout\.sh)|templates/(python-common/\.review-bots\.yaml|ts-common/\.github/\.review-bots\.yaml))$

      - id: lint-actions
        name: actionlint (workflows, repo + templates)
        entry: bash bin/ci/check_actions.sh
        language: system
        pass_filenames: false
        files: (^|/)\.github/workflows/.*\.(yml|yaml)$

      - id: docs-gap
        name: docs gap (published pages registered in mkdocs nav + docs/CLAUDE.md index, blueprintx#340)
        entry: python templates/python-common/bin/check_docs_gap.py --root .
        language: python
        additional_dependencies: [pathspec, pyyaml]
        pass_filenames: false
        always_run: true
      - id: required-checks-sync
        name: required checks vs PR jobs in sync (blueprintx#535)
        entry: python bin/ci/check_required_checks_sync.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        pass_filenames: false
        files: ^(\.github/workflows/.*\.ya?ml|bin/ci/required_checks_policy\.txt|\.github/required-checks\.json|bin/ci/check_required_checks_sync\.py)$
      - id: required-checks-sync-tests
        name: check_required_checks_sync should-fail regression tests (blueprintx#535)
        entry: bash tests/test_check_required_checks_sync.sh
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        pass_filenames: false
        files: ^(bin/ci/check_required_checks_sync\.py|tests/test_check_required_checks_sync\.sh)$
      - id: action-pins-tests
        name: check_action_pins should-fail regression tests (blueprintx#369)
        entry: bash tests/test_check_actions_pins.sh
        language: system
        pass_filenames: false
        files: ^(bin/ci/check_actions\.sh|tests/test_check_actions_pins\.sh)$

      - id: function-length
        name: function length (60 lines, docstring excluded)
        entry: python3 templates/python-common/bin/check_function_length.py --root .
        language: system
        pass_filenames: false
        files: \.(py|sh)$

      - id: check-comment-budget
        name: comment budget (zero tolerance ratchet, blueprintx#304)
        entry: python3 templates/python-common/bin/check_comment_budget.py --root . --require-baseline
        language: system
        pass_filenames: false

      - id: env-docs-sync
        name: .env.example and docs/configuration.md list the same variables (blueprintx#304)
        entry: python3 templates/python-common/bin/check_env_docs_sync.py --each-under templates
        language: system
        pass_filenames: false
        files: (^|/)(\.env\.example|configuration\.md|check_env_docs_sync\.py)$

      - id: check-complexity
        name: cyclomatic complexity (tests 1, src 2, bin 8)
        entry: bash templates/python-common/bin/check_complexity.sh --root .
        language: system
        pass_filenames: false
        files: \.py$

      - id: check-complexity-templates
        name: cyclomatic complexity (templates/python-common — tests 1, src 2, bin 8)
        entry: bash templates/python-common/bin/check_complexity.sh --root templates/python-common
        language: system
        pass_filenames: false
        files: ^templates/python-common/.*\.py$

      - id: gate-integrity
        name: gate integrity (a PR must not weaken a check without saying why)
        entry: python3 templates/python-common/bin/check_gate_integrity.py --root .
        language: system
        pass_filenames: false
        always_run: true

      - id: pr-file-count
        name: PR file-count ceiling (90 files, blueprintx#551)
        entry: python3 bin/ci/check_pr_file_count.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-secrets
        name: secret scan (gitleaks)
        entry: bash templates/python-common/bin/check_secrets.sh --root . --staged
        language: system
        pass_filenames: false
        always_run: true

      - id: test-copy-lists
        name: shared test copy lists (scaffolds vs python-common)
        entry: python3 bin/ci/check_test_copy_lists.py
        language: system
        pass_filenames: false
        files: ^(bin/scaffold/python_.*\.sh|templates/python-common/tests/unit/.*\.py)$

      - id: project-name-identities
        name: dist name vs import package (blueprintx#113)
        entry: bash bin/ci/check_project_name_identities.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/common\.sh|bin/blueprintx\.sh|bin/scaffold/python_.*\.sh|templates/lib-minimal/.*)$

      - id: validate-meta
        name: validate skeleton.meta integrity
        entry: bash bin/ci/validate_meta.sh
        language: system
        pass_filenames: false
        files: skeleton\.meta$

      - id: validate-meta-tests
        name: validate_meta.sh should-fail regression tests (blueprintx#407)
        entry: bash tests/test_validate_meta.sh
        language: system
        pass_filenames: false
        files: ^(bin/ci/validate_meta\.sh|tests/test_validate_meta\.sh)$

      - id: check-secrets-tests
        name: check_secrets.sh staged/full should-fail tests (blueprintx#759)
        entry: bash tests/test_check_secrets.sh
        language: system
        pass_filenames: false
        files: ^(templates/python-common/bin/check_secrets\.sh|tests/test_check_secrets\.sh)$

      - id: scaffold-comment-budget-tests
        name: generated projects ship the comment ratchet (blueprintx#826)
        entry: bash tests/test_scaffold_comment_budget.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/scaffold_comment_budget\.sh|bin/scaffold/.*\.sh|templates/common/bin/comment_budget_routing\.txt|templates/python-common/bin/check_comment_budget\.py|tests/test_scaffold_comment_budget\.sh)$

      - id: close-linked-issues-tests
        name: close_linked_issues.sh should-fail regression tests (blueprintx#604)
        entry: bash tests/test_close_linked_issues.sh
        language: system
        pass_filenames: false
        files: ^(templates/common/bin/close_linked_issues\.sh|templates/common/\.github/workflows/close-linked-issues\.yml|tests/test_close_linked_issues\.sh)$

      - id: dependabot-auto-merge-tests
        name: dependabot_auto_merge.sh should-fail regression tests (blueprintx#800)
        entry: bash tests/test_dependabot_auto_merge.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/common\.sh|\.github/workflows/dependabot-auto-merge\.yml|templates/common/bin/dependabot_auto_merge\.sh|templates/common/\.github/workflows/dependabot-auto-merge\.yml|tests/test_dependabot_auto_merge\.sh)$

      - id: check-pr-policy-tests
        name: check_pr_policy.sh should-fail regression tests (blueprintx#604)
        entry: bash tests/test_check_pr_policy.sh
        language: system
        pass_filenames: false
        files: ^(templates/common/bin/check_pr_policy\.sh|templates/common/\.github/(workflows/.*|PULL_REQUEST_TEMPLATE)\.(yml|md)|tests/test_check_pr_policy\.sh)$

      - id: docs-locale-prompt-tests
        name: docs-locale prompt should-fail regression tests (blueprintx#247)
        entry: bash tests/test_docs_locale_prompt.sh
        language: system
        pass_filenames: false
        files: ^(bin/blueprintx\.sh|bin/scaffold/python_[^/]+\.sh|templates/[^/]+/mkdocs\.yml|tests/test_docs_locale_prompt\.sh)$

      - id: prompt-tty-guard-tests
        name: scaffold prompt tty-guard should-fail tests (blueprintx#539)
        entry: bash tests/test_prompt_tty_guard.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/common\.sh|bin/lib/scaffold_[^/]+\.sh|bin/scaffold/[^/]+\.sh|tests/test_prompt_tty_guard\.sh)$

      - id: scaffold-first-commit-tests
        name: scaffold first-commit should-fail tests (blueprintx#812)
        entry: bash tests/test_scaffold_first_commit.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/common\.sh|bin/lib/scaffold_[^/]+\.sh|bin/scaffold/[^/]+\.sh|tests/test_scaffold_first_commit\.sh)$

      - id: scaffold-lint-test-cleanup-tests
        name: scaffold_lint_test.sh cleanup-trap should-fail tests (blueprintx#762)
        entry: bash tests/test_scaffold_lint_test_cleanup.sh
        language: system
        pass_filenames: false
        files: ^(bin/ci/(scaffold_lint_test|check_review_config_shipped)\.sh|bin/lib/no_background_git\.sh|tests/test_scaffold_lint_test_cleanup\.sh)$

      - id: spec-answers-tests
        name: --spec regression tests (blueprintx#629)
        entry: bash tests/test_spec_answers.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/(spec|common)\.sh|bin/blueprintx\.sh|bin/scaffold/python_[^/]+\.sh|templates/lib-minimal/.*|tests/test_spec_answers\.sh)$

      - id: scaffold-kanban-tests
        name: scaffold kanban board and labels should-fail tests (blueprintx#592)
        entry: bash tests/test_scaffold_kanban.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/(scaffold_kanban|common)\.sh|bin/lib/scaffold_git_remote\.sh|tests/test_scaffold_kanban\.sh)$

      - id: scaffold-git-remote-tests
        name: scaffold git-remote secret-before-push should-fail tests (blueprintx#732)
        entry: bash tests/test_scaffold_git_remote.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/(scaffold_git_remote|common)\.sh|tests/test_scaffold_git_remote\.sh)$

      - id: scaffold-python-templates-tests
        name: scaffold provenance and copy-list tests (blueprintx#635)
        entry: bash tests/test_scaffold_python_templates.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/(scaffold_(python_templates|provenance)|common)\.sh|templates/(python-)?common/.*|bin/scaffold/python_lib_minimal\.sh|templates/python-common/bin/check_template_drift\.py|tests/test_scaffold_python_templates\.sh)$

      - id: scaffold-list-copies-tests
        name: scaffold --list-copies tests, every tier (blueprintx#872)
        entry: bash tests/test_scaffold_list_copies.sh
        language: system
        pass_filenames: false
        files: ^(bin/lib/(scaffold_provenance|common)\.sh|bin/scaffold/[a-z_]+\.sh|tests/test_scaffold_list_copies\.sh)$

      - id: specs-structure
        name: .specs/ structure guard (blueprintx#447)
        entry: bash bin/ci/check_specs_structure.sh --root .
        language: system
        pass_filenames: false
        always_run: true

      - id: specs-structure-tests
        name: .specs/ structure guard should-fail regression tests (blueprintx#583)
        entry: bash tests/test_check_specs_structure.sh
        language: system
        pass_filenames: false
        files: ^(bin/ci/check_specs_structure\.sh|tests/test_check_specs_structure\.sh|bin/lib/common\.sh)$

      - id: promote-offline-to-online-tests
        name: promote_offline_to_online.sh refusal-path tests (blueprintx#382)
        entry: bash tests/test_promote_offline_to_online.sh
        language: system
        pass_filenames: false
        files: ^(bin/promote_offline_to_online\.sh|tests/test_promote_offline_to_online\.sh|bin/lib/common\.sh|templates/(common|python-common|lib-minimal|react-spa-webpack)/(\.github/|SECURITY\.md|optional/deploy/|docs_version/))

      - id: docs-boundary
        name: docs/ boundary guard (working material stays out of docs/, blueprintx#536)
        entry: bash bin/ci/check_docs_boundary.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: docs-boundary-tests
        name: check_docs_boundary.sh should-fail regression tests (blueprintx#536)
        entry: bash tests/test_check_docs_boundary.sh
        language: system
        pass_filenames: false
        files: ^(bin/ci/check_docs_boundary\.sh|tests/test_check_docs_boundary\.sh)$

      - id: pr-template-tests
        name: check_pr_template.sh should-fail regression tests (blueprintx#587)
        entry: bash tests/test_check_pr_template.sh
        language: system
        pass_filenames: false
        files: ^(bin/ci/check_pr_template\.sh|tests/test_check_pr_template\.sh|\.github/PULL_REQUEST_TEMPLATE\.md|templates/common/bin/lib/md_structure\.sh)$

      - id: readme-structure
        name: README structure (plain headings, slug sections, Authors links, blueprintx#867)
        entry: bash bin/ci/check_readme_structure.sh
        language: system
        pass_filenames: false
        files: ^(README\.md|templates/[^/]+/README(\.template)?\.md|templates/common/bin/(check_readme_structure\.sh|lib/md_structure\.sh)|bin/ci/check_readme_structure\.sh)$

      - id: readme-structure-tests
        name: check_readme_structure.sh and scaffold README should-fail tests (blueprintx#867)
        entry: bash -c 'bash tests/test_check_readme_structure.sh && bash tests/test_scaffold_readme.sh'
        language: system
        pass_filenames: false
        files: ^(templates/common/(bin/(check_readme_structure\.sh|lib/md_structure\.sh)|README\.template\.md)|templates/python-common/README\.md|bin/lib/scaffold_readme\.sh|tests/test_(check_readme_structure|scaffold_readme)\.sh)$

      - id: lockfile-sync
        name: lockfile sync (template package.json vs package-lock.json, blueprintx#588)
        entry: bash bin/ci/check_lockfile_sync.sh
        language: system
        pass_filenames: false
        files: ^(templates/[^/]+/package(-lock)?\.json|bin/ci/check_lockfile_sync\.sh)$

      - id: lockfile-sync-tests
        name: check_lockfile_sync.sh should-fail regression tests (blueprintx#588)
        entry: bash tests/test_check_lockfile_sync.sh
        language: system
        pass_filenames: false
        files: ^(bin/ci/check_lockfile_sync\.sh|tests/test_check_lockfile_sync\.sh)$

      - id: version-sync
        name: version sync (pyproject vs CLI)
        entry: bash bin/ci/check_version_sync.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: mkdocs-strict
        name: mkdocs build --strict
        entry: bash bin/ci/check_docs_build.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: makefile-pairing
        name: Makefile <-> tasks.sh <-> bin/help.sh pairing (blueprintx#241)
        entry: bash bin/check_makefile_pairing.sh
        language: system
        pass_filenames: false
        files: ^(Makefile|tasks\.sh|bin/help\.sh|bin/check_makefile_pairing\.sh)$

      - id: review-config-shipped
        name: every skeleton ships the hosted-reviewer config (blueprintx#740)
        entry: bash bin/ci/check_review_config_shipped.sh --static
        language: system
        pass_filenames: false
        files: ^(bin/scaffold/.*\.sh|bin/lib/.*\.sh|templates/common/.*|templates/[^/]+/skeleton\.meta|bin/ci/check_review_config_shipped\.sh)$

      - id: dependabot-shipped
        name: every skeleton ships dependabot.yml with a cooldown (blueprintx#838)
        entry: bash bin/ci/check_dependabot_shipped.sh --static
        language: system
        pass_filenames: false
        files: ^(bin/scaffold/.*\.sh|templates/common/\.github/dependabot\.yml|templates/ts-common/dependabot\.yml|templates/python-common/\.github/dependabot\.yml|templates/[^/]+/skeleton\.meta|bin/ci/check_dependabot_shipped\.sh)$

      - id: dependabot-shipped-tests
        name: dependabot guard should-fail regression tests (blueprintx#838)
        entry: bash tests/test_check_dependabot_shipped.sh
        language: system
        pass_filenames: false
        files: ^(bin/scaffold/.*\.sh|templates/.*dependabot\.yml|bin/ci/check_dependabot_shipped\.sh|tests/test_check_dependabot_shipped\.sh)$

      - id: review-roster-ladder-tests
        name: template review rosters trust the reviewer ladder (blueprintx#870)
        entry: bash tests/test_check_review_threads_roster.sh
        language: system
        pass_filenames: false
        files: ^(templates/python-common/\.review-bots\.yaml|templates/ts-common/\.github/\.review-bots\.yaml|templates/common/bin/check_review_threads\.py|tests/test_check_review_threads_roster\.sh)$

      - id: precommit-ci-parity
        name: pre-commit and CI run the same checks, both directions (blueprintx#384)
        entry: bash bin/check_precommit_ci_parity.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: docs-code-refs
        name: docs code references (symbols + import paths, blueprintx#159)
        entry: python3 templates/python-common/bin/check_docs_code_refs.py --root .
        language: system
        pass_filenames: false
        files: \.(py|md)$

      - id: quality-rules
        name: quality-rules.yaml validation (blueprintx#432)
        entry: python3 templates/python-common/bin/check_quality_rules.py --root .
        language: system
        pass_filenames: false
        always_run: true

      - id: check-markdown
        name: markdownlint (pymarkdownlnt, measured rule set — blueprintx#383)
        entry: bash bin/ci/check_markdown.sh
        language: system
        pass_filenames: false
        files: \.md$
